# gorge's pipeline on agentctl (plan-slice5 Task 5.14).
#
# Every value below reproduces gorge's orchestrator/config.py, gates.py and
# daemon.py as of the 2026-09-19 snapshot (gorge HEAD 1c83cd12, working tree);
# tests/test_consumer_parity.py in agentctl pins that. Change a value here,
# not in agentctl. Per-tick knobs (seats, caps, max_minutes) are overridden
# live through the dash (.ds4/orchestrator/overrides.json), not by editing
# this file.

[repo]
base_branch = "main"
state_dir = ".ds4"
worktrees_dir = ".worktrees"

# config.py:45-57, 96-98; seats.py:121 hard-codes the escalated thinking.
[seats.local]
provider = "bm-llms-glm"
model = "glm-5.3-flash"
thinking = "medium"

# 2026-09-19 (operator): the GPT/Codex seats are out for now (plan exhausted);
# every paid role runs DeepSeek-V4.1-Flash on DeepInfra. The key is
# DEEPSEEK_API_KEY, inherited from the supervisor's environment (~/.zshrc).
# To restore the GPT seats, swap the commented lines back in.
[seats.overflow]
# provider = "openai-codex"
# model = "gpt-5.6-terra"
provider = "deepinfra"
model = "deepseek-ai/DeepSeek-V4.1-Flash"
thinking = "high"
# 2026-09-22 (operator): spill to luna when DeepSeek has no free slot.
fallback = ["openai-codex/gpt-6-luna"]

[seats.escalated]
# 2026-09-22 (operator): "escalate terra" -> gpt-6-sol. DeepSeek-high was the top
# rung and no stronger than the codex reviewer: the 15:08Z batch parked at sol2
# with a fresh MAJOR every round. Escalation now runs gpt-6-sol (its own
# [caps.models] ceiling); reviewer and triage share the gpt-6-luna ceiling.
provider = "openai-codex"
model = "gpt-6-sol"
thinking = "high"

# 2026-09-22 (operator): reviewer back on a GPT codex seat, now gpt-6-luna
# (Codex plan verified live with a one-prompt probe). Implementers stay DeepSeek.
[seats.reviewer]
provider = "openai-codex"
model = "gpt-6-luna"
thinking = "medium"

# What an overrides.json entry may switch each role to (design §12.10); the
# daemon re-checks every override against this list. Astra is never listed
# 2026-09-22 (operator): triage has its own seat (agentctl b20353a); it
# falls back to local, then overflow, when this seat is full or cut off.
# gpt-6-luna's [caps.models] ceiling is shared with the reviewer seat.
[seats.triage]
provider = "openai-codex"
model = "gpt-6-luna"
thinking = "medium"

# (config.py:49-50). The reviewer list is design §13.2's example.
[seats.allow]
local = ["bm-llms-glm/glm-5.3-flash"]
# overflow = ["openai-codex/gpt-5.6-terra"]
# escalated = ["openai-codex/gpt-5.6-terra", "openai-codex/gpt-5.6-sol"]
# reviewer = ["openai-codex/gpt-5.6-terra", "openai-codex/gpt-5.6-sol", "bm-llms-glm/glm-5.3-flash"]
overflow = ["deepinfra/deepseek-ai/DeepSeek-V4.1-Flash", "openai-codex/gpt-6-luna"]
escalated = ["openai-codex/gpt-6-sol", "openai-codex/gpt-6-luna", "deepinfra/deepseek-ai/DeepSeek-V4.1-Flash"]
reviewer = ["openai-codex/gpt-6-luna", "openai-codex/gpt-6-sol", "deepinfra/deepseek-ai/DeepSeek-V4.1-Flash", "bm-llms-glm/glm-5.3-flash"]
triage = ["openai-codex/gpt-6-luna", "deepinfra/deepseek-ai/DeepSeek-V4.1-Flash", "bm-llms-glm/glm-5.3-flash"]

# config.py:64-65, 73, 79, 99-100, 119; daemon.py:308.
[policy]
review_local_fallback = true
review_local_thinking = "high"
# 2026-09-22 (operator): false. With the fallback on, 51 escalated rounds in
# 48h ran on local glm-flash because the DeepInfra cap was full, so the
# ladder's LAST chance ran on its weakest seat and exhausted straight into
# human_needed. An escalated round now waits for a paid slot instead.
escalation_local_fallback = false
local_endpoint_probe = true
# 2026-09-20 (operator): "stop taking all new tickets into local or paid jobs
# until needs-human or blocked jobs are resolved". While any ticket sits in
# human_needed, no `new` or `briefed` ticket starts; in-flight work still
# advances, so the fleet drains instead of growing.
# 2026-09-22 (operator): measured 686 of the last 1440 minutes on hold (11
# human_needed tickets in 24h, each freezing every new dispatch until a hand
# landing finished); the 20-min health check now lands parked tickets with an
# Opus agent, so the drain-while-parked policy costs more than it saves.
hold_new_while_parked = false
# 2026-09-22 (operator: "tackle WAITING/REVIEW before any new tickets; set it
# to 5"): while more than this many tickets sit in `waiting` (a fix round due,
# queued for a seat) or `review`, no `new`/`briefed` ticket starts; in-flight
# work keeps advancing and drains the backlog. Measured that day: 22 waiting
# behind the overflow rounds fresh tickets kept spawning. Needs agentctl pin
# >= the commit that adds the key.
hold_new_while_waiting_over = 5
# 2026-09-22 (operator): triage writes at most this many briefs ahead of the
# implementers; no new triage launches while this many sit in `briefed`.
triage_ahead = 100

max_local_rounds = 2
# 2026-09-19 (operator): the escalated tier is held for Claude. 0 means ONE
# DeepSeek escalated round after the local rounds (the ladder launches the first
# escalated round before it checks the cap), then human_needed, which a Claude
# operator session picks up with ~/projects/agentctl/docs/claude-operator-prompt.md.
# max_escalated_rounds = 5
# 2026-09-22 (operator): 3 escalated rounds (handle_failure checks the cap AFTER
# the round counter increments, so N means N rounds for N >= 1). Measured over the
# previous 48h: 26 of 34 human_needed entries were "review/gate failed and
# escalation ladder exhausted", 20 of the last 25 a REQUEST_CHANGES at the
# single escalated round, and a batch of 17 tickets queued at 15:08Z hit
# that wall together between 17:00 and 19:50Z (15 exhaustions in 3h).
# The Claude hand-landing path is the safety valve, not the pipeline.
max_escalated_rounds = 3
max_merge_rounds = 2
seat_start_grace_s = 180
# 2026-09-22 (operator): tick every 10s.
poll_seconds = 10

# config.py:75, 90-91.
# 2026-09-21 (operator): "2 local, 5 paid".
[caps]
local = 2
# 2026-09-22 (operator): the paid pool is sized to hold every per-model cap
# below at once; [caps.models] does the real bounding, so one paid provider
# can no longer fill the pool and push codex reviews onto the local seat.
# Raised to 12 with luna (4) joining the per-model caps.
paid = 12
max_minutes = 75

[caps.models]
"bm-llms-glm/glm-5.3-flash" = 2
"deepinfra/deepseek-ai/DeepSeek-V4.1-Flash" = 4
"openai-codex/gpt-6-sol" = 4
# 2026-09-22 (operator): luna seats (overflow spill, reviewer, triage) capped at 4.
"openai-codex/gpt-6-luna" = 4

# config.py:21-22.
[dispatch]
context_file = ".superpowers/ds4/gorge-context.md"
tails_dir = ".superpowers/ds4"

# config.py:17-19; daemon.py:62-80, 153-180.
[intake]
inbox = true
agent_tickets = true
feedback_dir = "feedback"

# git_ops.py:27-37 (create_worktree), :58-67 (triage), :80-86 (node_modules),
# :231-237 (TEST_HISTORY.md).
[worktree]
copy = [".ds4/ledger.json"]
link = [".cards", ".superpowers"]
hardlink = ["web/node_modules"]
ignore_uncommitted = ["TEST_HISTORY.md"]

# gates.py:114-148, in order; each gate's argv/timeout/env/cwd is gates.py:34-103.
[[gates]]
name = "go build"
cmd = ["go", "build", "./..."]
timeout = 900

[[gates]]
name = "go vet"
cmd = ["go", "vet", "./..."]
timeout = 600

# The whole module, not just ./effects ./rules ./cards: a merge that broke
# internal/searchprobe and internal/archtest passed the old core-only gate
# (2026-09-19, fixed in bd0f399e). -p=2 + GOMEMLIMIT: parallel package test
# binaries across worktrees have exhausted this box's memory before.
[[gates]]
name = "go test (module)"
cmd = ["go", "test", "-p=2", "-skip", "^TestHeads$", "./..."]
timeout = 1200
env = { GOMEMLIMIT = "5GiB" }

[[gates]]
name = "CR conformance"
cmd = ["go", "test", "-p=2", "./rules", "-run", "TestCR", "-v"]
timeout = 300
env = { GORGE_CR_CONFORMANCE = "1", GOMEMLIMIT = "5GiB" }
accept = "orchestrator.hooks:cr_no_fail_lines"

[[gates]]
name = "TestHeads"
cmd = ["go", "test", "./rules", "-run", "TestHeads", "-v"]
timeout = 120
blocking = false          # the TestHeads policy (hooks.testheads_policy) decides

[[gates]]
name = "make sim"
cmd = ["make", "sim"]
timeout = 600
accept = "orchestrator.hooks:sim_all_replayed"

[[gates]]
name = "npm run check"
cmd = ["npm", "run", "check"]
cwd = "web"
timeout = 300
applies_diff_touches = "web/"

[[gates]]
name = "npm test"
cmd = ["npm", "test"]
cwd = "web"
timeout = 300
retries = 1               # gates.py:80-91: one retry for layout-probe flakes, never more
applies_diff_touches = "web/"

[[gates]]
name = "npm run build"
cmd = ["npm", "run", "build"]
cwd = "web"
timeout = 300
applies_diff_touches = "web/"

[[gates]]
name = "smoke"
cmd = ["flock", "{orch_dir}/smoke.lock", "bash", "scripts/smoke.sh"]
timeout = 1200
applies_diff_touches = "web/"

# Bookkeeping gate failures go to the REVIEWER seat in mechanical-fix mode
# (agentctl spec docs/superpowers/specs/2026-09-23-tiered-dispatch-design.md
# §2): a post-rebase gate run whose EVERY failing `--- FAIL:` block matches one
# of these patterns is a census/ratchet/golden edit, not a defect. The reviewer
# makes the edit the test names, commits, and the gate re-runs; the round is not
# counted against the ladder. Patterns are measured from the gate logs of
# 2026-09-22, when 14 of 21 gate failures were this class and eight tickets
# parked on them. `all` blocks must match: a run mixing a census failure with a
# real test goes to the ordinary ladder. A run where a census test PANICS is
# deliberately not covered (the three 20:05-21:26Z runs): a panic can never be
# classified as bookkeeping. max_rounds = 0 turns the lane off.
[mechanical]
max_rounds = 2
patterns = [
  "paramcensus rot guard",
  "which is not in knownUnsupportedParams -- new gap",
  "param census: [0-9]+ of [0-9]+ distinct repo-deck cards carry",
  "still over-suppresses this API's gap",
  "Known-approximations rows exceed the [0-9]+-byte Stand-in cap",
  "registered but not expanded before the split",
  "kind [A-Za-z_]+ interest = [0-9]+, want [0-9]+",
  "teacher output moved: digest",
  "sampler output moved: digest",
]

# daemon.py:869-921; git_ops.py:205-216.
[landing]
strategy = "merge-push"
remote = "origin"
push = true
# 2026-09-22 (operator): the demo is no longer redeployed on every merge --
# a redeploy kills every in-flight vs-bot game (SIGTERM aborts live matches
# and the persistence dir is wiped). Deploy by hand: `make deploy-demo`.
deploy_cmd = []
post_merge = [["make", "ledger"]]
carry_trailers = ["Test-Budget-Approved:"]

# config.py:35, 138-163.
[harness]
pi_agent = "~/projects/ds4-harness/bin/pi-agent"
models_json = "~/.pi/agent/models.json"
probe_key_env = "BM_LLMS_API_KEY"

[harness.env_from_cmd.BM_LLMS_API_KEY]
cmd = ["kubectl", "--context", "k3d-bm", "-n", "llm-system", "get", "secret", "bm-llms-secrets", "-o", "jsonpath={.data.apiToken}"]
decode = "base64"

[hooks]
post_gates = "orchestrator.hooks:testheads_policy"
