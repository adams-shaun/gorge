# Front proxy for gorged. gorged serves the web client itself (it is embedded
# in the binary and index.html is rewritten at open time), so nginx forwards
# every path and adds what a public listener wants: compression, buffering
# off for the event streams, and long timeouts. There are no websockets; live
# updates are server-sent events.
#
# Docker's embedded DNS (127.0.0.11) resolves the upstream per request, so
# nginx starts before gorged is up and survives its restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    set $gorged_upstream gorged:8080;

    # Server-sent events: /api/stream, and the ManaBrew and SpellBench v2
    # per-match streams under /api/.../stream. No buffering, no gzip, and a read timeout longer than any idle
    # gap between events.
    location ~ ^/api/(.*/)?stream$ {
        proxy_pass http://$gorged_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else: the client, /api/, /art/ (card art), /cards/named and
    # the ManaBrew routes under /api/manabrew/.
    location / {
        proxy_pass http://$gorged_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
