# Public documentation site, published to GitHub Pages by
# .github/workflows/docs.yml. Only docs/site/ is published: docs/agents/,
# docs/decisions/ and docs/design/ are linked on GitHub instead.
#
# Local preview (needs only uv or a virtualenv):
#   uvx --with mkdocs-material==9.7.7 mkdocs serve
site_name: gorge
site_description: Two Magic rules engines in pure Go, with a server and browser client.
site_url: https://adams-shaun.github.io/gorge/
repo_url: https://github.com/adams-shaun/gorge
repo_name: adams-shaun/gorge
edit_uri: edit/main/docs/site/
docs_dir: docs/site
site_dir: site
strict: true

# Generated at build time and included by sets.md / packages.md through
# snippets; never pages of their own.
exclude_docs: |
  support/_generated_sets.md
  architecture/_generated_packages.md
  architecture/packages.tiers.json
  requirements.txt
  bots/magezero/*.svg
  research/figs/*.svg

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - content.tabs.link
    - navigation.instant
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  font:
    text: Schibsted Grotesk
    code: Spline Sans Mono
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [docs/site]
      check_paths: false

extra_css:
  - stylesheets/diagrams.css
  - stylesheets/theme.css
  - stylesheets/wire.css

