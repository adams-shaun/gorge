# Mergify merge queue, two-step CI (https://docs.mergify.com/merge-queue/two-step/), operator 11-16.
# Every pull request to main (no label, no approval: operator 11-16) enters the queue once its fast checks pass (`fast`: the diff's packages and
# the tests that import them; `lint`). Mergify then batches up to 10 queued PRs on a mergify/merge-queue/* branch,
# where CI runs the full suite once per batch; the batch merges when `ci-ok` is green there. A red batch is split.
queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - -draft
      - check-success=fast
      - check-success=lint
      # queue-precheck (.github/workflows/queue-precheck.yml) checks the queue's head merged onto main. It is a veto
      # only: a failing status keeps a PR out, a missing one does not. 11-24: requiring its success stalled the whole
      # queue for over an hour (no run finished, so no PR ever qualified); the batch's full suite is the gate.
      - -check-failure=queue-precheck
    merge_conditions:
      - check-success=ci-ok
    batch_size: 10
    batch_max_wait_time: 5 min
    merge_method: merge

merge_queue:
  max_parallel_checks: 4  # 11-24: 16 more runners on the 128-vCPU sub box

# A fix for a red main jumps the queue: push it on a hotfix/* branch and it is batched first. Only the `hotfix` label
# also interrupts a running batch (11-24: with every hotfix/* branch interrupting, auto-revert drafts and script fixes
# included, 17 batches were cancelled against 10 merged in four hours; retro-oracle-1124). Label a PR `hotfix` only when
# main is red and the running batch cannot pass. A hotfix/* branch's own checks also run on every box runner, not only the
# 4 gorge-pr ones (ci.yml): a label is not in the opened event's payload, so the branch name routes them.
# (https://docs.mergify.com/merge-queue/priority/).
priority_rules:
  - name: hotfix interrupts
    conditions:
      - label=hotfix
    priority: high
    allow_checks_interruption: true
  - name: hotfix branch first
    conditions:
      - head~=^hotfix/
      - -label=hotfix
    priority: high
    allow_checks_interruption: false
  # Evidence-loop PRs (evl/*) go into the next batch ahead of ordinary PRs (operator 11-18: evidence is P0), but never
  # cancel a running batch: on 11-18 eight evl PRs waited behind red batches, were dequeued or conflicted, and none merged.
  # Medium is 2000 (the default), high 3000; 2500 sits between them.
  - name: evidence next
    conditions:
      - head~=^evl/
    priority: 2500
    allow_checks_interruption: false

pull_request_rules:
  # Mergify recommends the queue over the merge action (batching, the combined-result check), so every PR to main is
  # queued, not merged directly.
  - name: queue every PR to main
    conditions:
      - base=main
      - -draft
    actions:
      queue:
