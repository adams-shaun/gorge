# Mergify merge queue, two-step CI (https://docs.mergify.com/merge-queue/two-step/), operator 11-16.
# A pull request to main labelled `queue` enters the queue once its fast checks pass (`fast`: the diff's packages and
# the tests that import them; `lint`). Mergify then batches up to 10 queued PRs on a mergify/merge-queue/* branch,
# where CI runs the full suite once per batch; the batch merges when `ci-ok` is green there. A red batch is split.
queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - label=queue
      - -draft
      - check-success=fast
      - check-success=lint
    merge_conditions:
      - check-success=ci-ok
    batch_size: 10
    batch_max_wait_time: 5 min
    merge_method: merge

merge_queue:
  max_parallel_checks: 2

pull_request_rules:
  - name: queue labelled PRs to main
    conditions:
      - base=main
      - label=queue
    actions:
      queue:
  - name: Auto-merge approved PRs
    conditions:
      - base = main
      - "#approved-reviews-by >= 0"
      - check-success = ci/build
    actions:
      merge:
        method: squash
