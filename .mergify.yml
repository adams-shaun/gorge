# Mergify merge queue, two-step CI (https://docs.mergify.com/merge-queue/two-step/), operator 11-16.
# Every pull request to main (no label, no approval: operator 11-16) enters the queue once its fast checks pass (`fast`: the diff's packages and
# the tests that import them; `lint`). Mergify then batches up to 10 queued PRs on a mergify/merge-queue/* branch,
# where CI runs the full suite once per batch; the batch merges when `ci-ok` is green there. A red batch is split.
queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - -draft
      - check-success=fast
      - check-success=lint
    merge_conditions:
      - check-success=ci-ok
    batch_size: 10
    batch_max_wait_time: 5 min
    merge_method: merge

merge_queue:
  max_parallel_checks: 2

pull_request_rules:
  # Mergify recommends the queue over the merge action (batching, the combined-result check), so every PR to main is
  # queued, not merged directly.
  - name: queue every PR to main
    conditions:
      - base=main
      - -draft
    actions:
      queue:
