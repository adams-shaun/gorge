<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Card menu fixture</title></head>
  <body>
    <!-- The radial card-action picker (3 options, seeded open) — the path a
         Ctrl-clicked hand/board cast takes through CardTile/OptionPicker.
         The margins keep the tile's badge away from the viewport edge so
         placeRadial's clamped placements cannot stack one wheel button on
         another (a corner-clamped wheel overlaps itself and the buttons
         intercept each other's clicks). -->
    <div id="radial" style="width: 220px; height: 320px; margin: 220px 0 0 260px"></div>
    <!-- The one-option direct-action affordance (a single cast icon). -->
    <div id="single" style="width: 220px; height: 320px; margin: 60px 0 0 260px"></div>
    <!-- The two-stage mana continuation (fb-e079def5): stage 1 is a 2-option
         ability wheel; answering it through the picker must re-open the
         stage-2 colour wheel at the card. -->
    <div id="followup" style="width: 220px; height: 320px; margin: 60px 0 0 260px"></div>
    <!-- Attacker declarations (fb-20260923T020152Z): a multi-pick
         `attackers` decision's options are SELECTIONS, so the wheel must
         stay open across successive attacker clicks. -->
    <div id="attackers" style="width: 220px; height: 320px; margin: 60px 0 0 260px"></div>
    <script type="module" src="/src/components/CardMenu.fixture.ts"></script>
  </body>
</html>
