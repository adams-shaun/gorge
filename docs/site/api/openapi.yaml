  "/api/stream":
    get:
      description: "One long-lived SSE connection per client. A fresh connection opens a session and starts with a `hello` frame carrying the session id; nothing else arrives until the client subscribes with POST /api/subscribe. Each frame is one SSE message (see StreamFrame); a `: ping` comment comes every 15 s.\n\n**Resume.** Send `Last-Event-ID: \u003csession\u003e:\u003cframe id\u003e` (the last `id:` seen) to resume within 30 s of a disconnect: the server replays the frames after that id from the session's ring and does not send hello again. An unknown session, a malformed id, or an id older than the ring starts a fresh session (hello, then the client re-subscribes).\n\n**Overflow.** The engine never waits on a client: when a session's buffer fills it is closed after one `overflow` frame naming how many frames were dropped."
      operationId: "stream"
      parameters:
        - description: "`\u003csession\u003e:\u003cframe id\u003e` to resume."
          example: "s00cc29e285fc2d3aab2b299e97fab509:2085"
          in: "header"
          name: "Last-Event-ID"
          required: false
          schema:
            pattern: "^[^:]+:[0-9]+$"
            type: "string"
      responses:
        "200":
          content:
            "text/event-stream":
              examples:
                decision:
                  summary: "a focus decision frame"
                  value: "id: s00cc29e285fc2d3aab2b299e97fab509:5\nevent: decision\ndata: {\"v\":1,\"t\":\"decision\",\"id\":5,\"table\":\"t2\",\"match\":5,\"seq\":20,\"body\":{\"player\":0,\"kind\":\"mulligan\",\"prompt\":\"Player 1 plays first. Keep your hand (put 0 cards on the bottom of your library) or take a mulligan?\"}}\n"
                event:
                  summary: "a focus event frame"
                  value: "id: s00cc29e285fc2d3aab2b299e97fab509:3\nevent: event\ndata: {\"v\":1,\"t\":\"event\",\"id\":3,\"table\":\"t2\",\"match\":5,\"seq\":19,\"body\":{\"event\":{\"seq\":19,\"kind\":\"decision_made\",\"player\":0,\"text\":\"starting_player:[0]\"},\"line\":\"Player 1 answers starting_player:[0]\"}}\n"
                hello:
                  summary: "the first frame of a fresh session"
                  value: "event: hello\ndata: {\"v\":1,\"t\":\"hello\",\"seq\":0,\"body\":{\"session\":\"s00cc29e285fc2d3aab2b299e97fab509\",\"tables\":[{\"id\":\"t1\",\"name\":\"Table 1\",\"seats\":2,\"spectator\":\"omniscient\",\"state\":\"live\",\"match\":1,\"perpetual\":false,\"format\":\"constructed\",\"bot_policy\":\"lethal-pressure\",\"seat_names\":[\"Player 1\",\"Player 2\"],\"mulligans\":1,\"auto_mana\":true},{\"id\":\"t2\",\"name\":\"Table 2\",\"seats\":2,\"spectator\":\"omniscient\",\"state\":\"cooldown\",\"match\":4,\"perpetual\":true,\"format\":\"constructed\",\"bot_policy\":\"lethal-pressure\",\"mulligans\":1,\"auto_mana\":true}]}}\n"
                match_end:
                  summary: "the match ended"
                  value: "id: s00cc29e285fc2d3aab2b299e97fab509:2085\nevent: match_end\ndata: {\"v\":1,\"t\":\"match_end\",\"id\":2085,\"table\":\"t2\",\"match\":5,\"seq\":1788,\"body\":{\"result\":\"win\",\"winner\":0,\"head\":\"5cdc95d2fe1f2a8a\"}}\n"
                match_start:
                  summary: "a match starts on a subscribed table"
                  value: "id: s00cc29e285fc2d3aab2b299e97fab509:1\nevent: match_start\ndata: {\"v\":1,\"t\":\"match_start\",\"id\":1,\"table\":\"t2\",\"match\":5,\"seq\":0,\"body\":{\"seats\":[{\"name\":\"Player 1\",\"deck\":\"mono-blue-tempo\",\"colour\":\"#e5484d\",\"deck_id\":\"mono-blue-tempo\"},{\"name\":\"Player 2\",\"deck\":\"mono-green-stompy\",\"colour\":\"#3b82f6\",\"deck_id\":\"mono-green-stompy\"}],\"seed\":5747796768693156649,\"spectator\":\"omniscient\",\"bot_policy\":\"lethal-pressure\"}}\n"
                ping:
                  summary: "the keep-alive comment"
                  value: ": ping\n"
                widget:
                  summary: "an overview widget (no id)"
                  value: "event: widget\ndata: {\"v\":1,\"t\":\"widget\",\"table\":\"t1\",\"match\":1,\"seq\":48,\"body\":{\"turn\":1,\"step\":\"main1\",\"phase\":\"main1\",\"active\":1,\"priority\":1,\"life\":[20,20],\"lost\":[false,false],\"stack_depth\":1,\"last\":\"Player 2 is asked: target\",\"state\":\"live\"}}\n"
              schema:
                $ref: "#/components/schemas/StreamFrame"
          description: "The event stream (Content-Type text/event-stream; Cache-Control no-cache, no-transform; X-Accel-Buffering no)."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/Internal"
      summary: "Server-Sent-Events stream"
      tags:
        - "stream"
  "/api/subscribe":
    post:
      description: "`overview` sends the table's coalesced `widget` frames plus match_start/match_end; `focus` sends a `snapshot` at once (when a match is live) then every `event`, `decision`, `rewind`, match_start and match_end. `table` `*` subscribes every table, overview only. Subscribing again replaces the table's mode."
      operationId: "subscribe"
      requestBody:
        content:
          "application/json":
            examples:
              focus:
                summary: "focus one table"
                value:
                  mode: "focus"
                  session: "s00cc29e285fc2d3aab2b299e97fab509"
                  table: "t2"
              overview:
                summary: "every table, overview"
                value:
                  mode: "overview"
                  session: "s00cc29e285fc2d3aab2b299e97fab509"
                  table: "*"
            schema:
              $ref: "#/components/schemas/Subscribe"
        required: true
      responses:
        "204":
          description: "Subscribed."
        "400":
          content:
            "application/json":
              examples:
                subscribe_badmode:
                  summary: "/api/subscribe"
                  value:
                    code: "bad_request"
                    message: "mode must be overview or focus"
                subscribe_wildfocus:
                  summary: "/api/subscribe"
                  value:
                    code: "bad_request"
                    message: "host: \"*\" may only be subscribed in overview mode"
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "Malformed body, a mode other than overview/focus, or `*` in focus mode."
        "404":
          content:
            "application/json":
              examples:
                subscribe_unknown_session:
                  summary: "/api/subscribe"
                  value:
                    code: "not_found"
                    message: "unknown session s0"
                subscribe_unknown_table:
                  summary: "/api/subscribe"
                  value:
                    code: "not_found"
                    message: "host: not found"
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "Unknown session (expired: reconnect the stream) or table."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
      summary: "Subscribe a stream session to a table"
      tags:
        - "stream"
