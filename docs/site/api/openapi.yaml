  "/api/tables/{t}/matches/{k}/intent":
    parameters:
      - $ref: "#/components/parameters/table"
      - $ref: "#/components/parameters/match"
    post:
      description: "Answer the claim's pending decision with option indices. `seq` and `player` must echo the decision; `choices` must be distinct in-range indices within min/max (and the kind's own rules, e.g. groups, required attackers). The seat comes from the token alone; there is no ?seat=. 204 means accepted and the game moves on; any rejection leaves the game exactly where it was."
      operationId: "submitIntent"
      parameters:
        - description: "`1` marks the answer as produced by the client's autopilot rather than a deliberate choice. Recorded in the match's provenance ledger only; never in the intent or the log."
          in: "query"
          name: "auto"
          required: false
          schema:
            enum:
              - "1"
            type: "string"
      requestBody:
        content:
          "application/json":
            examples:
              mulligan:
                summary: "answering a `mulligan` decision"
                value:
                  choices:
                    - 0
                  player: 0
                  seq: 22
              priority:
                summary: "answering a `priority` decision"
                value:
                  choices:
                    - 0
                  player: 0
                  seq: 33
              starting_player:
                summary: "answering a `starting_player` decision"
                value:
                  choices:
                    - 0
                  player: 0
                  seq: 18
              target:
                summary: "answering a `target` decision"
                value:
                  choices:
                    - 0
                  player: 0
                  seq: 1431
            schema:
              $ref: "#/components/schemas/Intent"
        required: true
      responses:
        "204":
          description: "Accepted."
        "400":
          content:
            "application/json":
              examples:
                intent_malformed:
                  summary: "/api/tables/t1/matches/1/intent"
                  value:
                    code: "bad_request"
                    message: "malformed JSON body: invalid character 'n' looking for beginning of object key string"
                intent_unknown_field:
                  summary: "/api/tables/t1/matches/1/intent"
                  value:
                    code: "bad_request"
                    message: "malformed JSON body: json: unknown field \"x\""
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "Malformed body (bad JSON, unknown field, over 64 KiB)."
        "401":
          content:
            "application/json":
              examples:
                intent_noclaim:
                  summary: "/api/tables/t1/matches/1/intent"
                  value:
                    code: "unauthorized"
                    message: "request does not hold a seat claim"
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "No seat claim."
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          content:
            "application/json":
              examples:
                intent_stale:
                  summary: "/api/tables/g1/matches/1/intent"
                  value:
                    code: "conflict"
                    message: "intent seq 153, pending decision seq 53"
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "Rejected by Decision.Validate or the seat state; `message` is the engine's reason."
      security:
        - seatBearer: []
        - seatQuery: []
      summary: "Answer the pending decision"
      tags:
        - "seat"
  "/api/tables/{t}/matches/{k}/pending":
    get:
      description: "The full decision currently parked on the claim's human seat: every legal option, and min/max on how many to choose. There is no spectator form: `seat` is required and must be the claim's own seat. Poll it, or watch the stream's `decision` frames, then answer with POST .../intent.\n\n| kind | min / max | options and answer |\n|---|---|---|\n| `priority` | 1 / 1 | One option per legal action (`play_land`, `cast`, `activate`, `ability`, ...) plus `pass` and `concede`. A `cast` option may be backed by `payment_actions` (auto-mana plans), answered with `payment`/`announce` instead of `choices`. |\n| `target` | per spell | One option per legal target (`player` or an object). `target_effect` describes what the targeting step does (damage, removal, granted statics). |\n| `attackers` | 0 / N | One `attacker` option per (creature, defender) pair; `player` is the defender seat, `battle` a permanent being attacked. Options sharing a `group` are mutually exclusive; `required` options must be included when they can be. |\n| `blockers` | 0 / N | One `block` option per (blocker, attacker) pair; `attacker` names the attacker; `group` keeps each blocker on one attacker; `min_blockers`/`max_blockers` bound an attacker's blocker count. |\n| `mulligan` | 1 / 1, or k / k | Keep phase: `keep` and (while a mulligan remains) `mulligan`. Bottom phase: one `bottom` option per card in hand, choose exactly as many as mulligans taken. |\n| `modes` | MinCharmNum / CharmNum | One `mode` option per mode, in printed order. Unless-pay asks use option `mode` `unless_pay` / `unless_decline`. |\n| `trigger_order` | N / N | A permutation of the controller's simultaneous triggers. `choices[0]` is put on the stack FIRST and so resolves LAST. |\n| `trigger_optional` | 1 / 1 | Exactly `yes` then `no`: put the optional trigger on the stack or not. |\n| `commander_zone` | 1 / 1 | Exactly `command_zone` then `leave`; asked of the commander's OWNER. |\n| `choose` | varies | One list pick; every option shares a kind naming what is chosen: `x` (with `amount`), `exile`, `sacrifice`, `discard`, `search`, `dig`, `name`, `type`, `number`, `yes`/`no`, `keep`, `dungeon`, `room`. |\n| `replacement` | 1 / 1 | Which applicable `replacement` applies next (`obj` is its source); also `mana` colour options and `apply`/`decline` for an optional replacement. |\n| `arrange` | varies | An ordered subset: chosen indices, in answer order, become pile A (index 0 ends closest to the top); the rest go to pile B, whose destination is the shared option kind (`bottom`, `graveyard`, `exile`, `hand`). `rest` may order pile B when `restable` is set. `hideaway_bottom`/`dig_bottom`: everything goes to the bottom, in answer order. |\n| `starting_player` | 1 / 1 | The toss winner picks who takes the first turn: one `player` option per living player. |"
      operationId: "getPending"
      parameters:
        - description: "Your seat; must equal the token's claim."
          in: "query"
          name: "seat"
          required: true
          schema:
            maximum: 255
            minimum: 0
            type: "integer"
