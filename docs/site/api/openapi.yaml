          description: "Archetype is a posterior over this seat's deck archetype, inferred from the cards REVEALED about it (its public battlefield, graveyard, exile and command-zone lists). It is filled for every seat EXCEPT the viewer's own -- the fact is an OPPONENT archetype posterior, and a seat's own deck identity is the manifest's job (deck.File.Archetype), not something to re-infer. It is nil when the viewer is a spectator or nothing classifiable has been revealed yet, and it never reads a hidden zone (a hidden hand is not a CardView at all) or a card name. Like Available it carries omitempty so a view with no posterior serialises byte-identically to before the field existed."
        available:
          additionalProperties:
            format: "int32"
            type: "integer"
          description: "Available is what this player could produce right now by tapping untapped permanents' free-to-tap mana abilities — the \"free mana one gains by tapping lands or other effects\" half of the seat box's line 3. It is derived from the battlefield (public), so it is filled for every seat under every visibility (seat, public, omniscient), never gated on \"is this the viewer's own seat\". It is always non-nil, even when empty (\"{}\"), like Pool. It is separate from Pool on purpose — a reader must never mistake mana that could be tapped for mana already floating. It carries omitempty (so an empty availability is absent, never a JSON null): Available is a public quantity that is only ever present-when- nonzero. Pool, in contrast, carries no omitempty and is always present as an object. This mirrors the sibling CmdDamage field, another public per-player map that is omitted when zero rather than sent as {}."
          type: "object"
        battlefield:
          items:
            $ref: "#/components/schemas/CardView"
          type:
            - "array"
            - "null"
        cmd_damage:
          additionalProperties:
            format: "int32"
            type: "integer"
          description: "CmdDamage is the commander damage this player has taken (CR 903.10), keyed by each commander's object id -- the 21-damage clock, public for every seat like a life total. nil/absent when the player has taken no commander damage (omitempty: absence is zero), so a Constructed game never pays for a per-player empty map."
          type: "object"
        command:
          description: "Command is the command zone (CR 903.6): the player's commanders currently sitting there, in zone order. A commander leaves it when it is cast (the object itself moves; its id is stable), so Command is the ever-shrinking subset of Commanders that can still be cast from the command zone under the CR 903.8 tax. Public for every seat -- ZCommand is not a hidden zone, and commander identity is open information."
          items:
            $ref: "#/components/schemas/CardView"
          type:
            - "array"
            - "null"
        commander_casts:
          description: "CommanderCasts runs parallel to Commanders: entry k is how many times Commanders[k] has been cast from the command zone, the CR 903.8 tax base for its next command-zone cast (an additional {2} per prior cast). Public for every seat -- the count is derived from public events."
          items:
            format: "int32"
            type: "integer"
          type:
            - "array"
            - "null"
        commanders:
          description: "Commanders is the player's full commander roster -- the same list m30's genesis built, in the same order, never shrunk as commanders are cast or die. A roster CardView projects the commander's CURRENT zone's state (a cast commander is a battlefield object, a dead one a graveyard object), so the roster is what lets a client -- and the bot policy's view-shaped half -- tell that a battlefield creature is a commander (the CR 903.10 clock's subject) even when it has left the command zone and not yet dealt damage. Public for every seat: the identity of a player's commanders is the premise of the format."
          items:
            $ref: "#/components/schemas/CardView"
