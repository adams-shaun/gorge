  "/api/tables/{t}/matches/{k}/decisions":
    get:
      description: "The recorded match's decision index: one entry per intent of the log, in order. Each entry names the decision the engine offered at that point (asking seat, kind, prompt, options with the labels the live client shows, capped at 64 plus every option the answer or explain note names; `options_total` is the uncapped count), the answer (`chosen`, `rest`, a short `answer` label and the `decision_made` text), the `ask_seq`/`made_seq` of its decision events (the replay's Decision step stops on `ask_seq`), and the record's explain note for that intent (a `bots/explain.Note`, or null). Mounted only by `gorged review`: a live server has no such route."
      operationId: "getReviewDecisions"
      responses:
        "200":
          content:
            "application/json":
              examples:
                priority:
                  summary: "a priority decision with no explain note"
                  value:
                    - answer: "Pass priority"
                      ask_seq: 221
                      chosen:
                        - 0
                      explain: null
                      intent: 40
                      kind: "priority"
                      made: "priority:[0]"
                      made_seq: 222
                      max: 1
                      min: 1
                      options:
                        - index: 0
                          kind: "pass"
                          label: "Pass priority"
                        - index: 1
                          kind: "concede"
                          label: "Concede"
                      options_total: 2
                      prompt: "turn 2, draw — dimir-tempo has priority"
                      round: 1
                      seat: 0
                      turn: 2
              schema:
                items:
                  $ref: "#/components/schemas/ReviewDecision"
                type: "array"
          description: "The decision index."
        "400":
          $ref: "#/components/responses/BadRequest"
