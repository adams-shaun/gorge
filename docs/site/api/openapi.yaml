    Decision:
      description: "Decision is the engine asking one player for one answer."
      properties:
        allow_none:
          description: "AllowNone makes the EMPTY answer legal beside the Min..Max range: the legal answer sizes are {0} and Min..Max. It is the \"you may ... exactly N\" shape -- Forge's Exactly$ True search (\"You may reveal exactly two cards you own with different names\", Extrapolate the Impossible) is all or nothing, so Min == Max == N carries the \"exactly\" and AllowNone the \"you may\". No Min/Max pair alone can say it: Min 0 would admit one card, Min N would refuse the decline. Validate is the rule's one home; a client that ignores the field only loses the decline (its Min..Max answers stay legal). omitempty: every other decision serialises byte-identically."
          type: "boolean"
        budgeted:
          description: "Budgeted marks MaxSum as a PRESENT budget even when it is zero or negative: a MaxSum of 0 alone reads as \"no budget\" (the omitempty zero), which cannot express a total-power cap of 0 or less (MaxTotalTargetPower$ \u003c= 0, where negative-power options can offset a positive one: powers 2,-1,-1 under a cap of 0 total 0). HasBudget is the one reader; false (the zero) omits the field, so every existing decision serialises byte-identically."
          type: "boolean"
        budgeted2:
          type: "boolean"
        charge_tap_pool:
          description: "ChargeTapPool is the number of permanents eligible to pay the declaration's tapXType obligation(s), measured BEFORE any attacker is declared -- the pool the obligation draws from. The engine plans the obligation with the declared attackers set aside, so a declaration that commits every candidate leaves the obligation unpayable; publishing the pool (with each option's Option.TapPoolCost) lets a rules-ignorant client see that in advance and lets ChargeTapPoolFit reject or repair such a declaration. It is published only when some offered pair carries a tapXType obligation whose candidates are a single readable shape, so every ordinary, tap-free declaration serialises byte-identically (0 = omitted = not published)."
          format: "int64"
          type: "integer"
        distinctTypePicks:
          description: "DistinctTypePicks requires each picked card to be assigned a different matching ChangeValid alternative (DigMultiple). SetProps lists the alternatives each option satisfies, including overlapping types."
          type: "boolean"
        groupLimit:
          description: "GroupLimit caps how many options ONE Group may contribute to an answer: the sum of the picked options sharing a Group must not exceed it. It is the per-type pick count of Forge's EACH multi-type search grammar (\"EACH Forest \u0026 Plains\" with ChangeNum$ 2 finds two Forests and two Plainses), where one Group is one listed type and its cap is ChangeNum -- a cap the single-pick exclusivity rule cannot express. 0 or 1 reads as the ordinary at-most-one-per-Group rule, so every existing decision serialises byte-identically and validates unchanged. Validate is the rule's one home; FitRequired and botpolicy's Clamp derive the same cap from GroupCap, never a second copy."
          format: "int64"
          type: "integer"
        groupLimits:
          additionalProperties:
            format: "int64"
            type: "integer"
          description: "GroupLimits maps a Group name to its own selection cap, overriding the decision-wide GroupLimit for that group. A per-defender attack ceiling (AttackRestrict's MaxAttackers$ scoped by ValidDefender$) is exactly this shape: each defended player is its own Group, and two such restrictions can cap different defenders differently, which one scalar GroupLimit cannot express. A group absent from the map, or mapped to a value below 2, falls back to GroupCap. GroupCapFor is the one reader, so Validate, FitRequired and botpolicy's repair cannot drift."
          type: "object"
        kind:
          $ref: "#/components/schemas/Kind"
        mana_payment:
          $ref: "#/components/schemas/ManaPaymentWindow"
          description: "ManaPayment is present only on the announced CR 601.2g window (the \"select mana\" prompt, announce-then-pay spec §4.1): total cost, what is still owed, the pool and the Auto-fill sources. Absent everywhere else, so every other decision serialises byte-identically."
        max:
          format: "int64"
          type: "integer"
        maxSum:
          description: "MaxSum, when \u003e 0, is a cumulative budget over the chosen options' Value fields: the sum of the picked options' Value must not exceed MaxSum. The engine's first user is a Dig's WithTotalCMC$ (\"put any number of nonland permanent cards with total mana value 4 or less from among them\"), which Option.Group's exclusivity cannot express -- a group says \"not both of these\", a budget says \"not all of these\". Validate enforces it as one more wire contract, so a rules-ignorant client can grey out an unaffordable pick without summing anything itself. 0 (no budget) omits the field, so every existing decision serialises byte-identically."
          format: "int64"
          type: "integer"
        maxSum2:
          description: "MaxSum2 and Budgeted2 are the independent second cumulative budget. Budgeted2 preserves a present zero or negative cap, just as Budgeted does."
          format: "int64"
          type: "integer"
        min:
          format: "int64"
          type: "integer"
        minSum:
          description: "MinSum is the mirror of MaxSum: a cumulative FLOOR over the chosen options' Value fields -- the sum must REACH it, not stay under it. The engine's first user is the tap-cost election of a withTotalPowerGE\u003cN\u003e group predicate (Crew's \"tap any number of other untapped creatures you control with total power N or greater\", Mossbridge Troll's): Option.Value carries the candidate's current power, and the floor is the whole \"total power N or greater\" clause. Validate enforces it as one more wire contract, so a rules-ignorant client can grey out an unaffordable pick without learning what power is; FitRequired's repair derives the same floor from this field, never a second copy. Every corpus floor is \u003e= 1, so 0 unambiguously reads as \"no floor\" and omits the field, keeping every existing decision byte-identical."
          format: "int64"
          type: "integer"
        options:
          items:
            $ref: "#/components/schemas/Option"
          type:
            - "array"
            - "null"
        payer_life:
          description: "PayerLife is the acting player's life total, published as the bound on a combat option's combined non-mana LIFE charge: the sum of the chosen options' CostLife plus each CostPhyrexian pip (priced at two life, CR 107.4f). It is the same kind of published rule input as MaxSum, and it exists because the combined charge is a WHOLE-declaration property the per-option list cannot express: a per-attacker state-based tax (Norn's Annex) offers every (attacker, defender) pair payable on its own, and only the sum overruns. Decision.requiredCore, RequiredQuota and FitRequired derive the charge-feasible required set from this one field, so the engine's declaration check and every client repair agree. 0 (omitted) means \"not published\" -- a player at 0 life has lost and cannot be asked, in the same way MaxSum 0 means \"no budget\" -- so every decision without a combat charge serialises byte-identically."
          format: "int32"
          type: "integer"
        payment_actions:
          description: "PaymentActions is an additive, separately indexed cast-payment extension. Keeping it outside Options preserves every legacy priority choice index. It remains empty until payplan-04 publishes executable offers."
          items:
            $ref: "#/components/schemas/PaymentAction"
          type: "array"
        payment_fallback:
          $ref: "#/components/schemas/PaymentFallback"
          description: "PaymentFallback is populated only if execution falls back to the normal manual payment window."
        player:
          maximum: 255
          minimum: 0
          type: "integer"
        prompt:
          type: "string"
        repeatable:
          description: "Repeatable relaxes Validate's no-duplicate-index rule: when true the SAME option index may be chosen more than once in one answer. It is set only by a modal (Charm) decision whose SA carries CanRepeatModes$ True -- CR 601.2b's \"you may choose the same mode more than once\" -- where the option list is the distinct modes and the answer is an ordered multiset of them. Every other decision keeps the strict rule. omitempty: a non-repeatable decision carries no field, so every existing payload serialises byte-identically."
          type: "boolean"
        restable:
          description: "Restable marks a KArrange ask whose answer MAY carry Intent.Rest -- the player-chosen order for pile B, the complement of the chosen set. Set only by the scry/surveil ask (effLookAndArrange), whose pile B can be non-empty AND observably ordered (CR 701.17's \"in any order\" for both piles). An ask without the flag still ACCEPTS a well-formed Rest (Validate's partition rule is kind-generic), but a client should not send one it was not offered -- for a Min == Max == N ask the only valid Rest is empty, so the flag is how a rules-ignorant client knows the second list exists. omitempty: every decision a client sees today serialises byte-identically."
          type: "boolean"
        seq:
          format: "uint64"
          minimum: 0
          type: "integer"
        source:
          description: "Source names the object this decision resolves for -- the spell whose {X} is being chosen, the card whose \"as it enters\" choice is pending -- so a prompt can always name its source (survey #18) without the client guessing it from the option labels. omitempty mirrors Obj: an ObjID of 0 means \"no object\", so decisions that do not resolve for a specific object (priority, mulligan, trigger order) carry no field and today's payloads are unchanged for them."
          maximum: 4294967295
          minimum: 0
          type: "integer"
        target_effect:
          $ref: "#/components/schemas/TargetEffect"
          description: "TargetEffect is host-independent targeting context. It is absent on other decision kinds and on older servers; absent means unknown."
        window_reasons:
          description: "WindowReasons is an opt-in diagnostic sidecar: the first gate that withheld each of this seat's candidates. Tokens only; never replay input. Nil when disabled, preserving every existing decision's bytes."
          items:
            $ref: "#/components/schemas/WindowReason"
          type: "array"
      required:
