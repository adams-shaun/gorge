          description: "Kind is the action kind, the same vocabulary decision.Option uses but restricted to real plays: \"cast\", \"ability\", \"granted\" (a max-speed granted ability), \"unlock\" (a Room door), \"turn_face_up\" (the morph family), \"specialize\", \"play_land\" and \"station\" -- every play kind the priority offer walk emits (rules.potentialPlayKind). The mana tap (\"activate\"), pass and concede are deliberately absent -- they are offered at every priority window and are never a play."
          type: "string"
        label:
          description: "Label is the offer label (\"Cast X\", \"Name: ability text\") -- the same string the corresponding Option would carry, so a client can surface the action without re-deriving it. omitempty: never empty in practice, but a defensive omit keeps the wire free of empty strings."
          type: "string"
        mode:
          description: "Mode distinguishes a \"cast\" potential action's payment kind (\"\", \"kicked\", \"surged\", \"flashback\", \"miracle\"), and a \"specialize\" one's target face index, exactly as Option.Mode does. omitempty: an ordinary cast carries no field."
          type: "string"
        obj:
          description: "Obj is the card or permanent the action names (the spell to cast from hand/command zone/graveyard, or the source of the ability), 0 when the action has no object. The id is the CardView id the client already has."
          maximum: 4294967295
          minimum: 0
          type: "integer"
        payable:
          description: "Payable is the payment planner's verdict for an ordinary cast from the hand or (Commander) the command zone: false only when the planner PROVED the cast unpayable -- an \"insufficient\" verdict whose source census is complete, or whose missed abilities a relaxation of them still cannot pay (decision.PotentialUnpayableCasts). It is what lets a client withhold a \"tap other mana first\" affordance that no amount of tapping can satisfy (fb-20261006T100405Z). nil (omitted) for every other kind, for a cast in an alternative/additional-cost mode, for a cast outside the hand and command zone, and for every verdict that is not a proof -- \"unsupported\" (a shape the planner does not price, e.g. Delve), \"search_limit\", \"ambiguous\" and a census-incomplete insufficiency -- because those do not prove the play possible or impossible. A client must not re-derive this from printed mana_cost: castable.ts records the cost rules that drift."
