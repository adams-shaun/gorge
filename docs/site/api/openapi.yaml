  "/api/unsubscribe":
    post:
      operationId: "unsubscribe"
      requestBody:
        content:
          "application/json":
            examples:
              one:
                summary: "drop t2"
                value:
                  session: "s00cc29e285fc2d3aab2b299e97fab509"
                  table: "t2"
            schema:
              $ref: "#/components/schemas/Unsubscribe"
        required: true
      responses:
        "204":
          description: "Unsubscribed."
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          content:
            "application/json":
              examples:
                unsubscribe_again:
                  summary: "/api/unsubscribe"
                  value:
                    code: "not_found"
                    message: "host: not found"
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "Unknown session, or the session was not subscribed to that table."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
      summary: "Drop a table from a stream session"
      tags:
        - "stream"
  "/art/blob/{key}":
    get:
      description: "The cached JPEG. Content-addressed, so it is served with `Cache-Control: public, max-age=31536000, immutable`."
      operationId: "artBlob"
      parameters:
        - description: "64 lowercase hex digits plus `.jpg`, as /art/named returns it."
          in: "path"
          name: "key"
          required: true
          schema:
            pattern: "^[0-9a-f]{64}(\\.jpg)?$"
            type: "string"
      responses:
        "200":
          content:
            "image/jpeg":
              schema:
                format: "binary"
                type: "string"
          description: "The image."
        "404":
          content:
            "text/plain":
              example: "404 page not found\n"
              schema:
                type: "string"
          description: "Not a valid key, or not cached."
      summary: "Cached art bytes"
      tags:
        - "cards"
  "/art/named":
    get:
      description: "Scryfall-shaped lookup the client resolves card images through. The first request for a name fetches it from Scryfall (paced, single-flight) into gorged's -art-dir; a fetch slower than the wait budget answers 503 while it keeps running."
      operationId: "artNamed"
      parameters:
        - $ref: "#/components/parameters/exact"
      responses:
        "200":
          content:
            "application/json":
              examples:
                elves:
                  summary: "Llanowar Elves"
                  value:
                    image_uris:
                      normal: "/art/blob/22ef506926986b45a7601d37016e99c22a59e8bfe624c2b2542e5b816084ecd7.jpg"
                    name: "Llanowar Elves"
              schema:
                $ref: "#/components/schemas/ArtNamed"
          description: "The art reference."
        "400":
          content:
            "text/plain":
              example: "exact is required\n"
              schema:
                type: "string"
          description: "`exact` is missing."
        "404":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "Scryfall has no such card."
        "502":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "The upstream fetch failed."
        "503":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "Still being fetched; retry shortly."
      summary: "Card art by exact name"
      tags:
        - "cards"
  "/art/token":
    get:
      description: "As /art/named, for a token: resolved by a Scryfall token search on the base name, picked deterministically by type line and printed P/T."
      operationId: "artToken"
      parameters:
        - $ref: "#/components/parameters/exact"
        - description: "The token's type line."
          in: "query"
          name: "types"
          required: false
          schema:
            type: "string"
        - description: "Printed power/toughness, e.g. `1/1`."
          in: "query"
          name: "ppt"
          required: false
          schema:
            type: "string"
        - description: "Current P/T; read only when `ppt` is absent (older clients)."
          in: "query"
          name: "pt"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          content:
            "application/json":
              examples:
                goblin:
                  summary: "a 1/1 Goblin token"
                  value:
                    image_uris:
                      normal: "/art/blob/dec002bfd7327546ceb843938447ff917825c8f0bb8f6db4e9cfd87df3a18524.jpg"
                    name: "Goblin Token"
              schema:
                $ref: "#/components/schemas/ArtNamed"
          description: "The art reference."
        "400":
          content:
            "text/plain":
              example: "exact is required\n"
              schema:
                type: "string"
          description: "`exact` is missing."
        "404":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "No matching token art."
        "502":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "The upstream fetch failed."
        "503":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "Still being fetched; retry shortly."
      summary: "Token art"
      tags:
        - "cards"
  "/cards/named":
    get:
      description: "The card's printed facts, from the same cache entry as its art (one Scryfall request serves both). gorged advertises this catalogue to its web client with `\u003cmeta name=\"gorge-cards\" content=\"/\"\u003e`."
      operationId: "cardsNamed"
      parameters:
        - $ref: "#/components/parameters/exact"
      responses:
        "200":
          content:
            "application/json":
              examples:
                elves:
                  summary: "Llanowar Elves"
                  value:
                    mana_cost: "{G}"
                    name: "Llanowar Elves"
                    oracle_text: "{T}: Add {G}."
                    power: "1"
                    toughness: "1"
                    type_line: "Creature — Elf Druid"
              schema:
                $ref: "#/components/schemas/CardFacts"
          description: "The facts."
        "400":
          content:
            "text/plain":
              example: "exact is required\n"
              schema:
                type: "string"
          description: "`exact` is missing."
        "404":
          content:
            "text/plain":
              example: "404 page not found\n"
              schema:
                type: "string"
          description: "Scryfall has no such card."
        "502":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "The upstream fetch failed."
        "503":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "Still being fetched; retry shortly."
      summary: "Printed card text by exact name"
      tags:
        - "cards"
  "/debug/pprof/":
    get:
      description: "net/http/pprof's index; the subtree pattern also serves each named profile, e.g. /debug/pprof/heap, /debug/pprof/goroutine?debug=2. Mounted only with -pprof, which gorged refuses unless -addr is loopback."
      operationId: "pprofIndex"
      responses:
        "200":
          content:
            "text/html":
              schema:
                type: "string"
          description: "The profile data."
      summary: "Profile index"
      tags:
        - "debug"
      x-gorge-requires: "-pprof"
  "/debug/pprof/cmdline":
    get:
      description: "The server's command line, NUL-separated. Mounted only with -pprof, which gorged refuses unless -addr is loopback."
      operationId: "pprofCmdline"
      responses:
        "200":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "The profile data."
      summary: "Command line"
      tags:
        - "debug"
      x-gorge-requires: "-pprof"
  "/debug/pprof/profile":
    get:
      description: "A CPU profile (?seconds=N, default 30), in pprof format. Mounted only with -pprof, which gorged refuses unless -addr is loopback."
      operationId: "pprofProfile"
      responses:
        "200":
          content:
            "application/octet-stream":
              schema:
                type: "string"
          description: "The profile data."
      summary: "CPU profile"
      tags:
        - "debug"
      x-gorge-requires: "-pprof"
  "/debug/pprof/symbol":
    get:
      description: "Symbol lookup (GET reports the symbol count; POST resolves program counters). Mounted only with -pprof, which gorged refuses unless -addr is loopback."
      operationId: "pprofSymbol"
      responses:
        "200":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "The profile data."
      summary: "Symbol lookup"
      tags:
        - "debug"
      x-gorge-requires: "-pprof"
    post:
      description: "POST a `+`-separated list of hex program counters; answers one `pc name` line each. Mounted only with -pprof."
      operationId: "pprofSymbolPost"
      requestBody:
        content:
          "text/plain":
            schema:
              type: "string"
      responses:
        "200":
          content:
            "text/plain":
              schema:
                type: "string"
          description: "Resolved symbols."
      summary: "Resolve program counters"
      tags:
        - "debug"
      x-gorge-requires: "-pprof"
  "/debug/pprof/trace":
    get:
      description: "An execution trace (?seconds=N). Mounted only with -pprof, which gorged refuses unless -addr is loopback."
      operationId: "pprofTrace"
      responses:
        "200":
          content:
            "application/octet-stream":
              schema:
                type: "string"
          description: "The profile data."
      summary: "Execution trace"
      tags:
        - "debug"
      x-gorge-requires: "-pprof"
servers:
  - description: "a local gorged (default -addr :8080)"
    url: "http://127.0.0.1:8080"
tags:
  - description: "Public, read-only configuration and listings."
    name: "lobby"
  - description: "A table's matches, board views and event logs. Spectator by default; seat-scoped with ?seat= and a seat token."
    name: "matches"
  - description: "Playing a human seat: read the pending decision, answer it, undo. Every call needs the seat's token."
    name: "seat"
  - description: "The Server-Sent-Events stream and its subscriptions."
    name: "stream"
  - description: "On-demand play-vs-bot games (gorged -vsbot)."
    name: "games"
  - description: "Draft events. Served only by a gorged running with -events, which is off by default; without it every path here is the JSON 404."
    name: "draft-events"
  - description: "gorged's same-origin card art and printed-text cache (fetched from Scryfall on first request)."
    name: "cards"
  - description: "Player bug reports (gorged -feedback DIR)."
    name: "feedback"
  - description: "Go runtime profiles (net/http/pprof), mounted only with -pprof on a loopback -addr."
    name: "debug"
  - description: "Match review (`gorged review`): read-only tables built from recorded games. Served only in review mode; a live server answers every path here with the JSON 404."
    name: "review"
