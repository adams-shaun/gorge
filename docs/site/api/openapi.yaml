          description: "LibraryTop is the player's own library's top card, revealed only when a live Continuous MayLookAt grant covers it (Vizier of the Menagerie's MayLookAt$ You look) and then only to that player's own seat -- the CR 400.2 hidden-zone redaction the Hand field documents applies to it -- or a MayLookAt$ Player \"play with the top card of your library revealed\" grant (Courser of Kruphix, Oracle of Mul Daya; CR 401.5) shows it to every seat. nil (an omitted JSON key) otherwise and whenever no grant is live."
        life:
          format: "int32"
          type: "integer"
        life_gained_this_turn:
          format: "int32"
          type: "integer"
