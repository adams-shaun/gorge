        has_initiative:
          description: "HasInitiative is the CR 726.1 initiative designation: true for the one player who currently has it. Public for every seat -- like the monarch, the designation is open information and drives attacking decisions. It carries omitempty so a match with no initiative (the common case) serialises byte-identically to before this field existed; an absent key means \"this seat does not have the initiative\", the Available convention."
          type: "boolean"
        land_drop_spent:
          description: "LandDropSpent is true when the seat may not play another land this turn by the land-drop count alone (lands played this turn has reached the allowance, Exploration-style extras included): the negation of MageZero's CanPlayLand, stated this way so the ordinary state -- a land still playable -- is the omitted zero. Timing (whose turn, which step, the stack) is deliberately not folded in: the fact is the count's."
