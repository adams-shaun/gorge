      description: "PotentialAction is one action a seat COULD take if it first floated every mana its untapped sources could produce: the engine's own legal-offer walk (engine/rules/legal.go) priced against a hypothetical pool instead of the floating one. It is the server-side answer to the float-then-cast payment model -- the engine prices a cast against the FLOATING pool only, so the priority window carries no cast option yet, and a client that re-derives \"castable after tapping\" on its own (printed costs, no live modifiers, no command zone, no flashback) drifts from the engine on every cost rule (Thalia's RaiseCost, a Medallion's ReduceCost, an Indeterminate Tron source, an X spell at 0). The projection carries only what the client's stop decisions need: which kind of action and where its object lives. A card/ability id is NOT a promise the action is currently offered -- it is a promise the engine WOULD offer it once the mana floated."
