    Option:
      description: "Option is one legal choice. Obj and Player are echoed only so a client can highlight the object; selection is by Index."
      properties:
        ability:
          description: "Ability anchors an \"ability\" option to its exact activated ability: the index into the source Face().Abilities being offered (Task 10), so a client can pop that ability's own text up beside the right ability on the card. The engine reads it in beginActivation, where a stale index degrades to a no-op. omitempty: options that are not ability options carry no field, and on an ability option a missing field is index 0 (the first ability), the one value that omits."
          format: "int64"
          type: "integer"
        alone_restricted:
          description: "AloneRestricted marks a KAttackers or KBlockers option whose creature is restricted from being declared ALONE (CR 506.5): declaring it is legal only when at least one other creature is declared as an attacker (a KAttackers option) or as a blocker (a KBlockers option) in the same declaration. The engine REJECTS a lone declaration (combat.DeclaresAlone, read by both declaration validators), so a rules-ignorant client -- the bot policy included -- needs the fact on the wire to build a legal declaration rather than have one refused. Decision.Validate enforces it and the shared repair (Decision.FitAlone, which botpolicy.Clamp runs) derives its rule from this same field, so the published fact cannot drift from the check. omitempty: an unrestricted option emits no field, so every ordinary option list serialises byte-identically."
          type: "boolean"
        alt_cost_index:
          description: "AltCostIndex says which cost a \"cast\" option pays: 0 is the card's own (RaiseCost/ReduceCost-adjusted) cost, i+1 is alternativeCosts(p, id)[i] -- an AlternativeCost static's cost instead -- so a client can show which of several costs the option pays. An \"ability\" option uses the same field for the same purpose: 0 is the ability's printed Cost$, 1 is its own AlternateCost$ rider (engine/rules/activate.go's abilityAlternateCost, the K:Equip expansion's fourth colon field), so an equip offering its alternate cost is distinguishable from the printed-cost option without parsing the label. omitempty mirrors Obj: an option paying the card's own cost (the common case, and the default every other Option literal in the tree relies on) carries no field, so today's payloads are unchanged for it."
          format: "int64"
          type: "integer"
        amount:
          description: "Amount is the X value an \"x\" choose option represents. The option's Index is its position in the list, not its value (see engine/rules/cast.go's xAsk), so without this field a client could not tell \"X = 4\" from \"X = 1\" without rereading the label. omitempty: only x options carry it, and on an x option a missing field is exactly X = 0 (the one value that omits), which the option's own label \"X = 0\" already shows."
          format: "int64"
          type: "integer"
        attacker:
          description: "Attacker tells a block option's client which attacker this blocker would block, so a human can see the pairing an in-process bot already can (the declare-blockers step is otherwise guessing). omitempty mirrors Obj: an ObjID of 0 means \"no object\", so an option that has no attacker (any non-block option) emits no field."
          maximum: 4294967295
          minimum: 0
          type: "integer"
        battle:
          description: "Battle, on an attacker option, names the non-player permanent being attacked -- a CR 310.7 battle or a planeswalker -- 0 meaning a player attack. Obj is the attacking creature and Player is the permanent's seat (the battle's protector, or the planeswalker's controller), so the pair alone cannot tell a permanent attack from a player attack by the same creature; this field is what the engine reads back at declaration time to record Object.AttackingBattle. omitempty: a player attack emits no field, so every existing option list serialises byte-identically."
          maximum: 4294967295
          minimum: 0
          type: "integer"
        cost:
          description: "Cost is the activation cost of a priority-window \"activate\" option whose mana ability costs MORE than a bare tap, in the same whitespace-delimited Forge notation AbilityCosts uses (engine/rules/mana.go's formatCost over ParseCost of the ability's Cost$ param) — \"T Sac\u003c1/Lion's Eye Diamond\u003e\" for Lion's Eye Diamond, \"T PayLife\u003c1\u003e\" for Mana Confluence. It is the wire marker the client's empty-priority-window floor and auto-pass need (fb-20260917T192520Z-26136705): isActionKind excludes every \"activate\" because a bare tap is offered at every window and is not a play, but a costly activation is exactly the play a ritual-combo deck needs the window for, and an empty hand leaves it the window's ONLY action — the floor passed it away unseen, and the card was unreachable for the rest of the game. A bare tap (every plain land) omits the field, so every existing option list and every plain-land window serialises byte-identically. omitempty: only a beyond-tap activation carries it."
          type: "string"
        cost_life:
          description: "CostLife is a block option's non-mana life component (CR 509.1b): the life the defender pays for declaring this block, beside Value's mana (the MaxSum budget's currency). A rules-ignorant client sums it against the defender's life total the same way. omitempty: an uncharged option emits no field, so every ordinary option list serialises byte-identically."
          format: "int64"
          type: "integer"
        cost_phyrexian:
          description: "CostPhyrexian is the number of Phyrexian pips a combat option's charge carries ({W/P} and friends, CR 107.4f): each pip is payable with one mana of its colour OR two life. The wire publishes the pip COUNT, not the colour below it -- a rules-ignorant client cannot see whether the colour branch is reachable, so it prices the life branch (two per pip) against the acting player's life total, exactly as it prices CostLife. omitempty as CostLife."
          format: "int64"
          type: "integer"
        cost_taps:
          description: "CostTaps is a block option's total tapXType obligation: how many permanents declaring this block taps. The engine resolves the exact permanents deterministically (rules' blockTapPlan), so a client that cannot see the eligible pool -- the shipped bot policy included -- treats a positive value as an obligation it cannot verify and declines the option rather than submit a declaration the validator may reject. omitempty as CostLife."
          format: "int64"
          type: "integer"
        counter:
          description: "Counter identifies the counter kind for wildcard counter-removal costs. It is omitted for choices that do not select a counter kind."
          type: "string"
        group:
          description: "Group is an exclusivity marker: two options carrying the SAME non-empty Group are mutually exclusive, and at most one of them may be selected in a single answer. The whole contract is that sentence -- it says nothing about blockers, creatures or combat, which is exactly so a rules-ignorant client may enforce it without learning any rules. A client that sees the player pick an option whose Group is already represented in the picked set naturally REPLACES the previously picked option from that group (moving a blocker from one attacker to another should just work) rather than refusing the click. No two options of one Group may be selected together, which Decision.Validate enforces as a general rule."
          type: "string"
        index:
          format: "int64"
          type: "integer"
        keyword:
          description: "Keyword anchors an \"ability\" option whose body a DERIVED keyword line grants (CR 613.1f): a layer-6 `AddKeyword$ Cycling:1 U` / `AddKeyword$ TypeCycling:Sliver:3` static (Tectonic Reformation, Rhet-Tomb Mystic, Jo Grant, Homing Sliver) gives a hand card a cycling ability no printed face carries, so neither the Ability index nor the SVar name anchors it -- the option carries the keyword line itself (\"Cycling:1 U\"), which beginActivation synthesizes the ability body from, exactly the SVar-anchor shape with the line standing in for the name. omitempty: only keyword-granted options carry it, so every existing option list serialises byte-identically."
          type: "string"
        kind:
          type: "string"
        label:
          type: "string"
        mana_symbol:
          description: "ManaSymbol is the exact mana symbol selected by a colour option. Labels remain presentation-only; omitempty keeps unrelated options unchanged."
          type: "string"
        max_blockers:
          format: "int64"
          type: "integer"
        min_blockers:
          description: "MinBlockers/MaxBlockers are the CR 509.1a MinMaxBlocker bounds on the ATTACKER this block option names (Min$ N: the attacker can be blocked only by 0 or at least N creatures; Max$ N: by at most N; both set) together for Min$ All, where the attacker must be blocked by every legal blocker). They exist for the same reason Required does: the engine REJECTS a whole-declaration count outside the bounds (combat.ValidateMinMaxBlockers), so a rules-ignorant client -- the bot policy included -- needs the bound on the wire to answer legally. Both are omitted for an unbounded attacker, so every ordinary option list serialises byte-identically."
          format: "int64"
          type: "integer"
        mode:
          description: "Mode distinguishes a \"cast\" option's payment kind: \"\" the card's own cost, \"kicked\", \"surged\", \"flashback\", \"miracle\" -- what the engine reads in beginCast's switch. A client renders a kicked/surged/ flashback/miracle cast differently from an ordinary one instead of parsing the label for a keyword. omitempty: an ordinary cast (Mode \"\") carries no field."
          type: "string"
        obj:
          maximum: 4294967295
          minimum: 0
          type: "integer"
        player:
          description: "Player is always emitted because 0 is a valid seat (0-indexed), unlike Obj where 0 means \"no object\"."
          maximum: 255
          minimum: 0
          type: "integer"
        required:
          description: "Required marks an attacker option whose creature MUST attack this combat (CR 508.1d): a goaded creature (CR 701.38) or one under an unconditional MustAttack static. A rules-ignorant client needs the flag because the engine REJECTS a declaration that omits a required creature it could have included (validateAttackDeclaration) -- an omission that looks legal on the wire otherwise. omitempty: a non-required option emits no field, so every existing option list serialises byte-identically."
          type: "boolean"
        svar:
          description: "SVar anchors a \"granted\" option (engine/rules/speed.go, the kw:Start your engines max-speed static's AddAbility$): the SVar name on the source face whose AB the activation resolves through. A granted ability is not a Face().Abilities index (the ordinary \"ability\" anchor), so it carries the name instead; beginGrantedActivation re-resolves it, so a stale name degrades to a no-op. omitempty: only granted options carry it."
          type: "string"
        tap_pool_cost:
          description: "TapPoolCost is the declaration-dependent half of a tapXType obligation: how many of the decision's published tap-candidate pool (Decision.ChargeTapPool) this option's permanent would occupy if chosen. A selected attacker that matches the obligation's spec is excluded from the pool the engine plans the obligation against (Hollow Warrior's tapXType\u003c1/Creature.!attacking\u003e), so a declaration can consume the very candidates its own tap obligation needs. The per-option CostTaps alone cannot express this -- the excluded candidate is the SELECTED creature, not the charging one -- so the option publishes its own pool cost and the shared rule (ChargeTapPoolFit) compares the pool the declaration leaves with the obligations it owes. 0 (omitted) means this option does not consume a published pool candidate, so every ordinary option list serialises byte-identically."
          format: "int64"
          type: "integer"
        target_hints:
          description: "TargetHints is the engine's opt-in hint for a cast or activation whose first targeting step is a hostile effect: own and opponent legal-target counts (see TargetHints). Information only; built by Engine.EnsureTargetHints for seats that ask. omitempty: absent for every option otherwise, so existing option lists serialise byte-identically."
          maximum: 4294967295
          minimum: 0
          type: "integer"
        value:
          description: "Value is the option's price under a decision carrying a cumulative budget (Decision.MaxSum): a Dig's WithTotalCMC$ cap sums the mana values of the picked cards, so each offered card names its own mana value here -- what lets Decision.Validate enforce \"total mana value \u003c= N\" over the chosen set without learning what a card is. Zero (mana value 0, or a decision with no budget) omits the field, so every existing option list serialises byte-identically."
          format: "int64"
          type: "integer"
        value2:
          description: "Value2 is the option's price under the decision's second cumulative budget (Decision.MaxSum2)."
          format: "int64"
          type: "integer"
      required:
        - "index"
        - "kind"
        - "label"
        - "player"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/engine/decision.Option"
