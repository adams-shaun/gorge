          type: "string"
        damage:
          $ref: "#/components/schemas/DamageEffect"
          description: "Damage is present only for recognised direct damage primitives (DealDamage and DamageAll). Absence is not proof that a whole spell's other abilities cannot deal damage."
        desc:
          description: "Desc is the script's noun for the legal target set (Forge ValidTgtsDesc); presentation only, never a legality fact. Absent when the script supplies none."
          type: "string"
        removal:
          $ref: "#/components/schemas/RemovalEffect"
          description: "Removal classifies the active SA's direct zone-removal shape. It is absent for an unknown API, a non-removal destination, or a ChangeZone whose destination this vocabulary does not model."
        statics:
          description: "Statics names the resolved Mode$ values of the continuous statics an Effect SA grants (its StaticAbilities$ SVar bodies). It is populated only for API \"Effect\" whose granted bodies resolve to a readable Mode$. The modes describe the static's SHAPE (CantBlockBy, Continuous, MustAttack, ...), never a verdict: a consumer must classify polarity itself, because the same mode can be a boon (CantBlockBy on one's own creature) or a restriction (Continuous shrinking an opponent). Empty when nothing resolves."
          items:
            type: "string"
          type: "array"
      required:
        - "api"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/engine/decision.TargetEffect"
    TargetView:
      description: "TargetView is one chosen target: exactly one of Obj and Player means anything, discriminated by IsPlayer — the same shape as state.Target."
      properties:
        is_player:
          type: "boolean"
        label:
          description: "Label is what the object was allowed to target, in the card's own words: its TgtPrompt$ when it has one (\"Select any target\"), else its ValidTgts$ (\"Creature\"). Empty when the object declares neither."
          type: "string"
        obj:
          maximum: 4294967295
          minimum: 0
          type: "integer"
        player:
          maximum: 255
          minimum: 0
          type: "integer"
      required:
        - "is_player"
        - "player"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/engine/view.TargetView"
    Unsubscribe:
      properties:
        session:
          type: "string"
        table:
          type: "string"
      required:
        - "session"
        - "table"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.Unsubscribe"
    View:
      description: "View is one seat's complete picture of the game: everything public, plus whatever is theirs alone (their hand, their mana pool, a decision asked of them)."
      properties:
        active:
          maximum: 255
          minimum: 0
          type: "integer"
        day_night:
          description: "DayNight is the CR 731 designation: \"day\", \"night\", or omitted while the game has neither; public for every seat."
          type: "string"
        decision:
          $ref: "#/components/schemas/Decision"
        draw:
          type: "boolean"
        over:
          type: "boolean"
        own_deck:
          $ref: "#/components/schemas/Manifest"
        pending:
          description: "Pending is the trigger queue, in the order it will be placed on the stack. Public for every seat — R3."
          items:
            $ref: "#/components/schemas/PendingView"
          type:
            - "array"
            - "null"
        phase:
          type: "string"
        players:
          description: "Players, Stack and Pending (below) are every public list this type carries. All of them are built non-nil even when empty (Ruling T23-u): a client should never have to treat a bare JSON `null` and an empty `[]` as the same \"nothing here\" case for one of these, the way it legitimately must for Hand/Pool below."
          items:
            $ref: "#/components/schemas/PlayerView"
          type:
            - "array"
            - "null"
        priority:
          maximum: 255
          minimum: 0
          type: "integer"
        round:
          format: "int32"
          type: "integer"
        stack:
          description: "Stack keeps g.Stack's own order: index 0 is the bottom, the last entry is the top. Public for every seat — R3."
          items:
            $ref: "#/components/schemas/StackView"
          type:
            - "array"
            - "null"
        step:
          type: "string"
        turn:
          description: "Turn is the engine's per-player-turn counter (TurnChange events). It increments once per seat's turn, so a four-seat table reads \"Turn 22\" after five and a half rounds. Round is the exact round-trip count of the players still alive, folded over the ordered event stream (RoundOf) by host, which has the log in hand when it builds this view; a caller with only a snapshot gets the roundOf approximation instead. Both Turn and Round are sent because the raw engine counter is what the transcript (\"Turn N: \u003cplayer\u003e\") refers to, and the round is what the board's clock shows."
          format: "int32"
          type: "integer"
        viewer:
          maximum: 255
          minimum: 0
          type: "integer"
        visibility:
          description: "Visibility names which rule set built this view: \"seat\", \"public\" or \"omniscient\" (see Visibility)."
          type: "string"
        winner:
          description: "Winner is nil unless Over \u0026\u0026 !Draw: PlayerID's zero value is seat 0, a real seat, so a bare PlayerID field could never distinguish \"seat 0 won\" from \"the game is still going\" or \"it was a draw\" (Task 22 finding 5). A JSON null is unambiguous where a bare 0 would not be."
          maximum: 255
          minimum: 0
          type:
            - "integer"
            - "null"
      required:
        - "active"
        - "draw"
        - "over"
        - "pending"
        - "phase"
        - "players"
        - "priority"
        - "round"
        - "stack"
        - "step"
        - "turn"
        - "viewer"
        - "visibility"
        - "winner"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/engine/view.View"
    Widget:
      description: "Widget is the overview cell: enough to draw a 2x2 life grid, a turn marker and a stack-depth badge, plus the last transcript line."
      properties:
        active:
          maximum: 255
          minimum: 0
          type: "integer"
        last:
          type: "string"
        life:
          items:
            format: "int32"
            type: "integer"
          type:
            - "array"
            - "null"
        lost:
          items:
            type: "boolean"
          type:
            - "array"
            - "null"
        phase:
          type: "string"
        priority:
          maximum: 255
          minimum: 0
          type: "integer"
        stack_depth:
          format: "int64"
          type: "integer"
        state:
          type: "string"
        step:
          type: "string"
        turn:
          format: "int32"
          type: "integer"
      required:
        - "active"
        - "last"
        - "life"
        - "lost"
        - "phase"
        - "priority"
        - "stack_depth"
        - "state"
        - "step"
        - "turn"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.Widget"
    WidgetFrame:
      allOf:
        - $ref: "#/components/schemas/Frame"
        - properties:
            body:
              $ref: "#/components/schemas/Widget"
            t:
              const: "widget"
          type: "object"
      description: "Overview subscriptions: the latest coalesced cell per table, flushed every 250 ms. Never has an SSE id and is never replayed on resume."
    WindowReason:
      description: "WindowReason is a closed-vocabulary explanation for one withheld option."
      properties:
        kind:
          type: "string"
        obj:
          maximum: 4294967295
          minimum: 0
          type: "integer"
        reason:
          type: "string"
      required:
        - "kind"
        - "obj"
        - "reason"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/engine/decision.WindowReason"
  securitySchemes:
    eventBearer:
      description: "A draft-event seat token (from POST /api/events or a join), as `Authorization: Bearer \u003ctoken\u003e`. Absent means a spectator."
      scheme: "bearer"
      type: "http"
    eventQuery:
      description: "The draft-event seat token as `?token=`."
      in: "query"
      name: "token"
      type: "apiKey"
    seatBearer:
      description: "A seat token, sent as `Authorization: Bearer \u003ctoken\u003e`. The server resolves it to exactly one (table, seat) claim; a seat number the client sends is only ever compared against the claim. Tokens come from POST /api/games (`token`), from gorged's startup log for -humans slots, or from -seat-token."
      scheme: "bearer"
      type: "http"
    seatQuery:
      description: "The same seat token as `?token=`, for browsers (the join URL carries it). The Authorization header wins when both are present."
      in: "query"
      name: "token"
      type: "apiKey"
externalDocs:
  description: "Human-readable reference"
  url: "https://adams-shaun.github.io/gorge/api/http/"
info:
  description: "The HTTP surface of `gorged`, gorge's game server: JSON endpoints for the lobby, a table's matches, board views and event logs, the seat-scoped decision/intent loop, the play-vs-bot game factory, the Server-Sent-Events stream, and gorged's own card-art, card-text, feedback and profiling routes.\n\n**Derived from code and guarded.** Every operation here is registered in `server/host/httpapi` or `server/gorged`, and every route registered there is here: `server/host/httpapi/openapi_test.go` fails the build in either direction. Every schema carrying `x-go-type` is generated from that Go type's source by `internal/tsgen` and checked for freshness by the same test (`go test ./server/host/httpapi -run TestOpenAPI -update` regenerates them). The examples are real responses captured from a live server on 2026-10-20.\n\n**Versioning.** Bodies follow `server/protocol` (`protocol.Version` = 1, the `v` field of every stream frame). The version bumps only on a breaking change to a body; additive fields do not bump it, so clients must ignore unknown fields. There is no version prefix in the URL.\n\n**Errors.** Every `/api/` error is a JSON `ErrorBody` (`code`, `message`, and `head` on a 409 `beyond_head`). gorged's non-API routes (`/art/`, `/cards/`, `/api/feedback`, `/debug/pprof/`) answer errors as `text/plain`."
  license:
    identifier: "Apache-2.0"
    name: "Apache-2.0"
  summary: "Lobby, match history, seat play and the live SSE stream of a gorged server."
  title: "gorged HTTP API"
  version: "protocol-v1"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
openapi: "3.1.0"
paths:
  "/api/bot-policies":
    get:
      description: "The hosted bot policies this server offers (gorged -bot-policies) in display order, and the default a POST /api/games without bot_policy gets. Pure configuration: always 200, the empty listing when nothing is offered."
      operationId: "listBotPolicies"
      responses:
        "200":
          content:
            "application/json":
              examples:
                offered:
                  summary: "a default gorged (measured strength claims elided here)"
                  value:
                    default: "lethal-pressure"
                    policies:
                      - cost_note: "not measured; INFERRED \u003c1 ms (bot vs bot ~550k games/h on 8 workers)"
                        cost_scope: "per decision"
                        description: "The production baseline policy. On auto-pay tables it uses combat simulation for attacks and blocks."
                        formats:
                          - "constructed"
                          - "commander"
                        label: "Bot"
                        mean_ms: 0
                        name: "bot"
                        p95_ms: 0
                        search: false
                        strength:
                          - claim: "(elided in this reference)"
                            setting: "(elided in this reference)"
                            source: "(elided in this reference)"
                            versus: "plain auto-pay bot"
                        tier: "production"
                      - cost_note: "not measured; same policy shape as bot, INFERRED \u003c1 ms"
                        cost_scope: "per decision"
                        description: "The production heuristic bot with the measured A2 Forge-derived target rules armed (land colour, prominent colour, fatal-copy filter) and the A1 removal-now hold rule."
                        formats:
                          - "constructed"
                          - "commander"
                        label: "Forge heuristic"
                        mean_ms: 0
                        name: "forge-heuristic"
                        p95_ms: 0
                        search: false
                        strength:
                          - claim: "(elided in this reference)"
                            setting: "(elided in this reference)"
                            source: "(elided in this reference)"
                            versus: "bot"
                        tier: "experimental"
                      - cost_note: "as bot"
                        cost_scope: "per decision"
                        description: "The manual hosted bot policy; on auto-pay tables it uses its own decision rules rather than the production bot's combat-simulation arm."
                        formats:
                          - "constructed"
                          - "commander"
                        label: "Lethal Pressure"
                        mean_ms: 0
                        name: "lethal-pressure"
                        p95_ms: 0
                        search: false
                        strength:
                          - claim: "(elided in this reference)"
                            setting: "(elided in this reference)"
                            source: "(elided in this reference)"
                            versus: "pre-AR7 bot"
                        tier: "experimental"
              schema:
                $ref: "#/components/schemas/BotPolicyList"
          description: "The offered set."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
      summary: "List the offered bot policies"
      tags:
        - "lobby"
  "/api/capabilities":
    get:
      description: "Which optional surfaces this server serves, so a client can decide what to draw without probing a route that 404s when the surface is off. Pure configuration: always 200. events is true when the /api/events routes are mounted (gorged -events)."
      operationId: "getCapabilities"
      responses:
        "200":
          content:
            "application/json":
              examples:
                plain:
                  summary: "a server started without -events"
                  value:
                    events: false
              schema:
                $ref: "#/components/schemas/Capabilities"
          description: "The server's capabilities."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
      summary: "Report the server's optional surfaces"
      tags:
        - "lobby"
  "/api/decks":
    get:
      description: "Every deck the server loaded; `id` is what POST /api/games takes as human_deck/bot_deck. With `policy`, only the decks a game against that bot policy may use: its reserved pool when it has one, else the unreserved decks."
      operationId: "listDecks"
      parameters:
        - description: "A bot policy name (see GET /api/bot-policies)."
          in: "query"
          name: "policy"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          content:
            "application/json":
              examples:
                catalogue:
                  summary: "first three entries of a real catalogue"
                  value:
                    - archetype: "wur-avengers"
                      commander: "Captain America, Team Leader"
                      format: "commander"
                      id: "avengers-assemble"
                      name: "Avengers Assemble"
                    - archetype: "pauper-burn"
                      format: "constructed"
                      id: "boros-moxite-burn"
                      name: "Boros Moxite Burn"
                    - archetype: "knights"
                      commander: "Sidar Jabari of Zhalfir"
                      format: "commander"
                      id: "cavalry-charge"
                      name: "Cavalry Charge"
              schema:
                items:
                  $ref: "#/components/schemas/DeckInfo"
                type: "array"
          description: "The decks."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
      summary: "List the deck catalogue"
      tags:
        - "lobby"
  "/api/events":
    get:
      description: "Every event's public state."
      operationId: "listEvents"
      responses:
        "200":
          content:
            "application/json":
              schema:
                items:
                  $ref: "#/components/schemas/EventState"
                type: "array"
          description: "List draft events."
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "No such event, or this server is not running with -events."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "A backend refusal: the draft-event runtime picks the status and `code`."
      security:
        - {}
        - eventBearer: []
        - eventQuery: []
      summary: "List draft events"
      tags:
        - "draft-events"
      x-gorge-requires: "-events (a binary with a draft-event runtime)"
    post:
      description: "Create a 4-seat draft event. The response carries the creator's seat token."
      operationId: "createEvent"
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CreateEventResponse"
          description: "Create a draft event."
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "No such event, or this server is not running with -events."
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: "A backend refusal: the draft-event runtime picks the status and `code`."
      security:
        - {}
        - eventBearer: []
        - eventQuery: []
      summary: "Create a draft event"
      tags:
        - "draft-events"
      x-gorge-requires: "-events (a binary with a draft-event runtime)"
  "/api/events/personas":
    get:
      description: "The pick-bot persona names a create body's drafter fields accept."
