          description: "PotentialActions is this seat's \"what could I still do after tapping out\" projection, filled ONLY for the viewer's own seat (the walk reads the seat's own hand, command zone and graveyard -- a CR 400.2 hidden zone, so another seat's would leak it). Empty/nil means the engine would offer nothing the seat could pay for even after floating every untapped source: the auto-pass stop decision reads this field and nothing else, so it inherits the engine's own cost rules (live RaiseCost/ReduceCost, commander tax, command-zone and flashback casts, X priced at 0, indeterminate sources) instead of a client-side re-derivation of them. It carries omitempty: a seat with no potential actions is absent, like Available."
