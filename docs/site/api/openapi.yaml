          description: "Dungeon is this player's active public dungeon and venture room."
        exile:
          items:
            $ref: "#/components/schemas/CardView"
          type:
            - "array"
            - "null"
        graveyard:
          items:
            $ref: "#/components/schemas/CardView"
          type:
            - "array"
            - "null"
        graveyard_size:
          format: "int64"
          type: "integer"
        hand:
          description: "Hand is nil (marshalling to a literal JSON null, not an omitted key -- it deliberately carries no \"omitempty\" tag) for every seat but the viewer's own, whose Hand is always non-nil even when empty (\"[]\"). omitempty cannot express \"present but possibly empty\": with it, the viewer's own EMPTY hand would have marshalled identically to another seat's HIDDEN one (the key simply missing either way), which is exactly the ambiguity this type exists to avoid everywhere else (Winner's own *PlayerID is the same shaped fix). null-vs-[] is what a client checks instead. Hand is a hidden zone under CR 400.2 and is gated on \"is this the viewer's own seat\", widened by CR 720.4 to a seat the viewer controls (you may look at all cards that player could see), unlike Pool (next field), which is public."
          items:
            $ref: "#/components/schemas/CardView"
          type:
            - "array"
            - "null"
        hand_size:
