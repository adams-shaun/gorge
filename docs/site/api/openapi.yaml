          type: "object"
      description: "Focus: who is being asked what (kind and prompt only). A seat reads the full decision from GET .../pending."
    DecisionKindGuide:
      description: "The closed set of decision kinds (decision.Kinds; the generated `Kind` enum) and what each asks. An answer is always an Intent naming option indices; Decision.Validate is the one fence.\n\n| kind | min / max | options and answer |\n|---|---|---|\n| `priority` | 1 / 1 | One option per legal action (`play_land`, `cast`, `activate`, `ability`, ...) plus `pass` and `concede`. A `cast` option may be backed by `payment_actions` (auto-mana plans), answered with `payment`/`announce` instead of `choices`. |\n| `target` | per spell | One option per legal target (`player` or an object). `target_effect` describes what the targeting step does (damage, removal, granted statics). |\n| `attackers` | 0 / N | One `attacker` option per (creature, defender) pair; `player` is the defender seat, `battle` a permanent being attacked. Options sharing a `group` are mutually exclusive; `required` options must be included when they can be. |\n| `blockers` | 0 / N | One `block` option per (blocker, attacker) pair; `attacker` names the attacker; `group` keeps each blocker on one attacker; `min_blockers`/`max_blockers` bound an attacker's blocker count. |\n| `mulligan` | 1 / 1, or k / k | Keep phase: `keep` and (while a mulligan remains) `mulligan`. Bottom phase: one `bottom` option per card in hand, choose exactly as many as mulligans taken. |\n| `modes` | MinCharmNum / CharmNum | One `mode` option per mode, in printed order. Unless-pay asks use option `mode` `unless_pay` / `unless_decline`. |\n| `trigger_order` | N / N | A permutation of the controller's simultaneous triggers. `choices[0]` is put on the stack FIRST and so resolves LAST. |\n| `trigger_optional` | 1 / 1 | Exactly `yes` then `no`: put the optional trigger on the stack or not. |\n| `commander_zone` | 1 / 1 | Exactly `command_zone` then `leave`; asked of the commander's OWNER. |\n| `choose` | varies | One list pick; every option shares a kind naming what is chosen: `x` (with `amount`), `exile`, `sacrifice`, `discard`, `search`, `dig`, `name`, `type`, `number`, `yes`/`no`, `keep`, `dungeon`, `room`. |\n| `replacement` | 1 / 1 | Which applicable `replacement` applies next (`obj` is its source); also `mana` colour options and `apply`/`decline` for an optional replacement. |\n| `arrange` | varies | An ordered subset: chosen indices, in answer order, become pile A (index 0 ends closest to the top); the rest go to pile B, whose destination is the shared option kind (`bottom`, `graveyard`, `exile`, `hand`). `rest` may order pile B when `restable` is set. `hideaway_bottom`/`dig_bottom`: everything goes to the bottom, in answer order. |\n| `starting_player` | 1 / 1 | The toss winner picks who takes the first turn: one `player` option per living player. |"
      enum:
        - "priority"
        - "target"
        - "attackers"
        - "blockers"
        - "mulligan"
        - "modes"
        - "trigger_order"
        - "trigger_optional"
        - "commander_zone"
        - "choose"
        - "replacement"
        - "arrange"
        - "starting_player"
      type: "string"
    DeckCheck:
