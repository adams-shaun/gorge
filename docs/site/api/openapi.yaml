          description: "Amount is the nonnegative literal or context-resolved amount at the point the target decision is posed, or nil (JSON null) if it is absent, unresolvable, invalid or outside the supported range. X and SVar expressions are evaluated when the announced/resolving context supplies their value. A known zero is a non-nil pointer to 0. There is deliberately no numeric default: Go consumers must check nil before dereferencing; wire consumers must check null before arithmetic. This is not a lethal-damage claim."
