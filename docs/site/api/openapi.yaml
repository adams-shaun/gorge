      requestBody:
        content:
          "multipart/form-data":
            schema:
              properties:
                client.json:
                  description: "Optional browser diagnostics: one JSON document, at most 256 KiB."
                  type: "string"
                screenshot:
                  description: "Optional PNG (checked by signature)."
                  format: "binary"
                  type: "string"
                seat:
                  description: "Seat whose view to snapshot."
                  type: "string"
                table:
                  description: "Table id to snapshot."
                  type: "string"
                text:
                  description: "The report (required, non-blank)."
                  type: "string"
                url:
                  description: "The page the player was on."
                  type: "string"
              required:
                - "text"
              type: "object"
        required: true
      responses:
        "201":
          content:
            "application/json":
              examples:
                stored:
                  summary: "a stored report"
                  value:
                    id: "20261020T174814Z-2cad6253"
              schema:
                $ref: "#/components/schemas/FeedbackCreated"
          description: "Stored."
        "400":
          content:
            "text/plain":
              example: "feedback: text is required\n"
