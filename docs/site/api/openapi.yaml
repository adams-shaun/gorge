          format: "int32"
          type: "integer"
        lost:
          type: "boolean"
        name:
          type: "string"
        planar_deck:
          items:
            $ref: "#/components/schemas/CardView"
          type: "array"
        pool:
          additionalProperties:
            format: "int32"
            type: "integer"
          description: "Pool is the mana currently floating in this player's pool. It is PUBLIC information under the CR: a mana pool is not one of the seven zones in CR 400.1 and holds no cards, so CR 400.2's hidden-zone framework (library and hand) has no purchase on it; instead CR 106.4a, 106.4b, 117.3d and 118.3a all require a player to ANNOUNCE what is in their pool, an obligation that is incoherent for information meant to be hidden. So Pool is projected for every seat under every visibility (seat, public, omniscient), like Available. It is always non-nil, even when empty (\"{}\"), because there is no longer a hidden state to distinguish: an empty pool is simply \"{}\". The field carries no omitempty, so it is always present even when zero -- the one wire distinction it keeps against Available (which carries omitempty and is absent when nothing is available)."
          type:
            - "object"
            - "null"
        pool_restrictions:
          description: "PoolRestrictions annotates Pool: one entry per batch of floating mana whose producing ability carried a RestrictValid$ spend limit, naming the colour, the amount and a human-readable spend text. It exists because Pool alone renders a bare spendable-looking chip for mana a cast may in fact refuse (Cavern of Souls' {B} that pays only for a creature spell of the chosen type), leaving the seat unable to learn why no cast was offered. Like Pool it is public information -- the restriction is derived from a public battlefield permanent's own ability (CR 106.4a/106.4b), so it is projected for every seat under every visibility. It carries omitempty: a seat holding no restricted mana is absent, never a JSON null, so every view without a restriction serialises byte-identically to before this field existed (the Available convention). A batch whose Valid is empty -- an AddsNoCounter$-only batch, which imposes no spend limit -- is omitted: this field names spend restrictions, and such a batch has none."
          items:
