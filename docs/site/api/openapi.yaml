# Rendered from openapi.json by server/host/httpapi's openapi_test.go; do not edit.
components:
  parameters:
    eventId:
      description: "Draft event id."
      in: "path"
      name: "id"
      required: true
      schema:
        type: "string"
    exact:
      description: "The card's exact printed name. Missing or blank: 400."
      example: "Llanowar Elves"
      in: "query"
      name: "exact"
      required: true
      schema:
        type: "string"
    match:
      description: "Match index on the table, 1-based. Not a positive integer: 400 `bad_request`."
      example: 1
      in: "path"
      name: "k"
      required: true
      schema:
        minimum: 1
        type: "integer"
    seat:
      description: "Read as this seat instead of as a spectator. It must equal the seat the request's token holds at this table: no claim is 401, a claim for another seat or table is 403, a spectator-only server is 403."
      in: "query"
      name: "seat"
      required: false
      schema:
        maximum: 255
        minimum: 0
        type: "integer"
    seq:
      description: "Project the board as of this event seq (inclusive). Absent: the match's latest event. Past the head: 409 `beyond_head` with `head` set."
      in: "query"
      name: "seq"
      required: false
      schema:
        minimum: 0
        type: "integer"
    since:
      description: "First event seq to return (inclusive); default 0, the whole log. At or past the event count: 409 `beyond_head`."
      in: "query"
      name: "since"
      required: false
      schema:
        default: 0
        minimum: 0
        type: "integer"
    table:
      description: "Table id, e.g. `t1` (startup tables) or `g1` (an on-demand vs-bot table)."
      example: "t2"
      in: "path"
      name: "t"
      required: true
      schema:
        type: "string"
  responses:
    BadRequest:
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
      description: "Malformed parameter or body (`bad_request`). A JSON body must be one object of the documented shape: unknown fields and trailing garbage are refused, bodies are capped at 64 KiB."
    BeyondHead:
      content:
        "application/json":
          examples:
            beyond:
              summary: "seq=99999999"
              value:
                code: "beyond_head"
                head: 3994
                message: "host: seq beyond head 3994"
          schema:
            $ref: "#/components/schemas/ErrorBody"
      description: "The requested seq is past the match's head (`beyond_head`); `head` is the last valid seq, so a client can clamp and retry."
    Forbidden:
      content:
        "application/json":
          examples:
            wrong_seat:
              summary: "token for seat 0, asked for seat 1"
              value:
                code: "forbidden"
                message: "claim holds seat 0, not the requested seat 1"
            wrong_table:
              summary: "token for t1, asked about t2"
              value:
                code: "forbidden"
                message: "claim does not hold a seat at this table"
          schema:
            $ref: "#/components/schemas/ErrorBody"
      description: "The server is spectator-only, or the claim is for another seat or table (`forbidden`)."
    Internal:
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorBody"
      description: "A server bug or I/O failure (`internal`)."
    MethodNotAllowed:
      content:
        "application/json":
          examples:
            delete:
              summary: "DELETE /api/tables"
              value:
                code: "method_not_allowed"
                message: "DELETE is not allowed here"
          schema:
            $ref: "#/components/schemas/ErrorBody"
      description: "The path exists but not for this method (`method_not_allowed`)."
    NotFound:
      content:
        "application/json":
          examples:
            no_endpoint:
              summary: "GET /api/nope"
              value:
                code: "not_found"
                message: "no such endpoint"
            unknown_table:
              summary: "GET /api/tables/nope/matches"
              value:
                code: "not_found"
                message: "host: not found"
          schema:
            $ref: "#/components/schemas/ErrorBody"
      description: "No such table, match or session (`not_found`). Also every `/api/` path the server does not serve."
    Unauthorized:
      content:
        "application/json":
          examples:
            no_claim:
              summary: "no token"
              value:
                code: "unauthorized"
                message: "request does not hold a seat claim"
          schema:
            $ref: "#/components/schemas/ErrorBody"
      description: "The request needs a seat claim and holds none (`unauthorized`)."
  schemas:
    AnnounceSelection:
      description: "AnnounceSelection is the announce-then-pay selector (spec docs/design/2026-09-27-announce-then-pay.md §3): it names an offered PaymentAction by ID and asks the engine to begin that ordinary cast WITHOUT a payment witness, so the caster pays in the CR 601.2g mana window (\"select mana\" prompt) instead. It is exclusive with Choices, Rest and Payment, valid only on a priority answer, and only for an action that carries at least one plan -- the planner's proof that the floating pool plus untapped sources can pay the cast."
      properties:
        action_id:
          type: "string"
      required:
        - "action_id"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/engine/decision.AnnounceSelection"
    ArchetypePosterior:
      description: "ArchetypePosterior is a posterior over an opponent's deck archetype, inferred from the cards revealed about that seat. It is nil for the viewer's own seat and for a spectator: the fact is an OPPONENT archetype posterior, and a seat's own deck identity is already the manifest's job (deck.File.Archetype), not something to re-infer from its graveyard."
      properties:
        known:
          description: "Known reports whether any revealed card carried a classifiable signal."
          type: "boolean"
        scores:
          additionalProperties:
            type: "number"
          description: "Scores is the full normalised posterior, keyed by archetype name. It is built with a fixed key order (dense index order) and only ever read by key, so no map-range order can reach the wire."
          type: "object"
        seen:
          description: "Seen is how many distinct revealed cards were classified."
          format: "int64"
          type: "integer"
        top:
          description: "Top is the highest-probability archetype's name (\"\" when !Known)."
          type: "string"
        top_score:
          description: "TopScore is that archetype's posterior probability."
          type: "number"
      required:
        - "known"
        - "seen"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/engine/view.ArchetypePosterior"
    ArtNamed:
      description: "The two fields of a Scryfall named-card response the client reads, with `image_uris.normal` rewritten to this server's own content-addressed /art/blob/ route."
      properties:
        image_uris:
          properties:
            normal:
              description: "Same-origin path: /art/blob/\u003c64 hex\u003e.jpg"
              type: "string"
          required:
            - "normal"
          type: "object"
        name:
          type: "string"
      required:
        - "name"
        - "image_uris"
      type: "object"
    BotMeasurement:
      description: "BotMeasurement is one measured claim of a hosted bot policy. It is the wire twin of bots.Measurement: a single label with the setting and source it was measured under, never a number the client is expected to interpret."
      properties:
        claim:
          type: "string"
        setting:
          type: "string"
        source:
          type: "string"
        versus:
          type: "string"
      required:
        - "claim"
        - "setting"
        - "source"
        - "versus"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.BotMeasurement"
    BotPolicyInfo:
      description: "BotPolicyInfo is one selectable hosted bot policy (GET /api/bot-policies). It is the wire twin of bots.Info, carrying only what a client needs to render a picker and disclose the measurement; protocol never imports bots, so gorged converts one to the other at startup (server/gorged/botpolicies.go)."
      properties:
        cost_note:
          type: "string"
        cost_scope:
          type: "string"
        description:
          type: "string"
        formats:
          items:
            type: "string"
          type:
            - "array"
            - "null"
        label:
          type: "string"
        mean_ms:
          type: "number"
        name:
          type: "string"
        p95_ms:
          type: "number"
        search:
          type: "boolean"
        strength:
          items:
            $ref: "#/components/schemas/BotMeasurement"
          type:
            - "array"
            - "null"
        tier:
          type: "string"
      required:
        - "cost_note"
        - "cost_scope"
        - "description"
        - "formats"
        - "label"
        - "mean_ms"
        - "name"
        - "p95_ms"
        - "search"
        - "strength"
        - "tier"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.BotPolicyInfo"
    BotPolicyList:
      description: "BotPolicyList is GET /api/bot-policies: the offered set, in display order, and the server's default. An unset list is the empty policy set with an empty default, so an older server answers the endpoint without exposing any state."
      properties:
        default:
          type: "string"
        policies:
          items:
            $ref: "#/components/schemas/BotPolicyInfo"
          type:
            - "array"
            - "null"
      required:
        - "default"
        - "policies"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.BotPolicyList"
    Capabilities:
      description: "Capabilities is GET /api/capabilities: which optional surfaces this server serves, so a client can decide what to draw without probing a route that 404s when the surface is off. Additive, and always 200. Events is true when the /api/events routes are mounted."
      properties:
        engine:
          description: "Engine names the engine this server creates tables on; absent for gorge."
          type: "string"
        events:
          type: "boolean"
      required:
        - "events"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.Capabilities"
    CardFacts:
      description: "A card's six printed facts, cached from Scryfall beside its art (server/gorged/art.go cardFacts). Empty facts are omitted."
      properties:
        mana_cost:
          type: "string"
        name:
          type: "string"
        oracle_text:
          type: "string"
        power:
          type: "string"
        toughness:
          type: "string"
        type_line:
          type: "string"
      required:
        - "name"
      type: "object"
    CardView:
      description: "CardView is one object's public face: printed identity plus its current, derived characteristics. Nothing here is read from a hidden zone unless the viewer owns it — cardViews is only ever called with a zone list the caller has already decided is visible."
      properties:
        ability_costs:
          description: "AbilityCosts is the current offer-time Forge-notation cost of each non-mana activated ability, in face ability order. Applicable RaiseCost/ReduceCost statics have already been composed exactly as the engine's legal-action gate composes them; this is deliberately not just the printed Cost$. It is projected only for battlefield cards and the viewer's own hand: those are the cards an interactive seat can use to decide whether floating mana would unlock an ability. Other zones leave it nil, rather than turning this into a general rules-text projection."
          items:
            type: "string"
          type: "array"
        activated_this_turn:
          description: "ActivatedThisTurn is how many non-mana activated abilities of this object were activated this turn (events.Apply's AbilityPush census on state.Object.ActivatedThisTurn). Public fact, like the tap state it rides beside; the bot policy's repeatable-ability budget (A5) reads it to bound its own loop-shaped activations (Basalt Monolith's untap re-enabling its own tap) without ever gating a human seat, for whom unlimited activations stay legal and offered."
          format: "int32"
          type: "integer"
        attached_player:
          maximum: 255
          minimum: 0
          type: "integer"
        attached_to:
          description: "AttachedTo is the permanent this Aura or Equipment is currently attached to, 0 meaning unattached -- the same zero-value convention Obj uses, so omitempty keeps an unattached permanent (or a non- permanent: a spell, a card in a hand) from emitting a field. It comes straight from state.Object.AttachedTo, which the engine's Attach event sets and clears; without it a client could not render an attachment beneath the permanent it modifies -- could not tell what is attached to what at all."
          maximum: 4294967295
          minimum: 0
          type: "integer"
        attached_to_player:
          description: "AttachedToPlayer is true when this Aura/Curse is attached to the player AttachedPlayer rather than to a permanent (AttachedTo stays 0); the bool disambiguates seat 0 from \"no player\", the omitted zero."
          type: "boolean"
        attacking:
          type: "boolean"
        attacking_player:
          description: "AttackingPlayer is the seat this creature is attacking while Attacking is true, nil otherwise; BlockedBy lists the creatures blocking it. Both exist for the arrow overlay (PL-17) and come straight from the object's combat fields, which EndCombatReset clears."
          maximum: 255
          minimum: 0
          type: "integer"
        aura_logic:
          description: "AuraLogic is the AttachAILogic hint (\"Pump\", \"Curse\", ...) of a card whose spell is an Aura aimed at a creature, \"\" for every other card. It is a printed deck-builder hint of a visible card. The opt-in A5 attach rules read it to hold a boon Aura while the caster controls no creature that could use it."
          type: "string"
        blocked_by:
          items:
            maximum: 4294967295
            minimum: 0
            type: "integer"
          type: "array"
        card_name:
          description: "CardName is the object's PRINTED card name -- its card's front face, the name its genesis deck list (deck.Manifest) records -- when that differs from Name: a transformed or back-face-played double-faced card, a split or adventure half on the stack, a permanent a copy effect (CopyFace) or a SetName$ renamed. Empty when it equals Name, and on every redacted face-down CardView (the redaction rebuilds the view from a fresh literal). The physical card's identity is exactly as visible as the object carrying it: a copy or a transformed permanent is a public card whose printed front every player can read. The honest own-library composition (view.OwnLibrary) keys on it, so a Clone copying one of the seat's own cards is counted as the Clone it is, not as a second copy of what it copies."
          type: "string"
        colour_identity:
          description: "ColourIdentity is the card's colour IDENTITY mask (cards.ColourMask: the printed cost's pips, the colour indicator and every colour-naming mana symbol in the rules text -- CR 903.4's definition, the same one cards.Face.ColourIdentity derives). It is a printed fact of a visible card, like Types and ManaCost, and it is projected so a bot can read a deck's colour splash from the lands it plays without re-parsing text. Carried into botpolicy.Card.Colour; a face-down or unreadable card projects zero, which is \"identity unknown\", never \"colourless\"."
          maximum: 255
          minimum: 0
          type: "integer"
        combat_trick:
          description: "CombatTrick reports whether the primary spell ability is a combat trick (effects.CastCombatTrick)."
          type: "boolean"
        controller:
          description: "Controller and Owner can differ (a stolen permanent, a stack object created for someone else's turn); a client needs both. Battlefield zone lists are keyed by controller, every hidden/graveyard/exile list by owner (engine/events/apply.go's zoneOwner), so a CardView carries both regardless of which zone list it came from."
          maximum: 255
          minimum: 0
          type: "integer"
        counters:
          additionalProperties:
            format: "int32"
            type: "integer"
          type: "object"
        damage:
          format: "int32"
          type: "integer"
        effective_mana_cost:
          description: "EffectiveManaCost is the offer-time cost to cast this card when the engine can determine a non-X own-cost composition that differs from the printed ManaCost. Empty means use ManaCost."
          type: "string"
        exiled_cards:
          items:
            maximum: 4294967295
            minimum: 0
            type: "integer"
          type: "array"
        face_down:
          type: "boolean"
        flags:
          description: "Flags are the permanent's status designations (CardFlag bits), straight from the state.Object fields the engine folds from events: suspected, renowned, monstrous, harnessed, solved, cloaked, the Ring-bearer, a morph/disguise cast and the unlocked Room doors. Public facts like the tap state; zero (omitted) on every ordinary card, so a view without any of them serialises byte-identically to before the field existed."
          maximum: 65535
          minimum: 0
          type: "integer"
        id:
          maximum: 4294967295
          minimum: 0
          type: "integer"
        imprinted:
          description: "Imprinted lists the cards this permanent imprinted (state.Object.Imprinted, CR 607.2a), Paired the creature it is soulbond-paired with (0 = none), and ExiledCards the cards it exiled that are still in exile (the Oblivion Ring link). They are bare object ids: the cards themselves are the CardViews of whichever zone list they sit in, so a reader resolves them there and a hidden card stays hidden. All omitted when empty."
          items:
            maximum: 4294967295
            minimum: 0
            type: "integer"
          type: "array"
        is_copy:
          type: "boolean"
        is_token:
          description: "IsToken and IsCopy are the object's own state.Object flags projected for every visible card: a battlefield token (CR 111.7) and a copy (CR 707.10; a battlefield token copy carries BOTH) are public identity facts like the name they sit beside, and a client wire that mints its own identity DTO reads them rather than re-deriving one from Token -- which is the display tag every card carries, never a token flag. cardViews' face-down replacement rebuilds the CardView from a fresh literal without them, so a card hidden behind its face reveals no more than that projection already did; and since a token exists only on the battlefield and a copy only on the stack or the battlefield, neither flag can name a card in a hidden zone."
          type: "boolean"
        keywords:
          items:
            type: "string"
          type: "array"
        mana_cost:
          description: "ManaCost is the printed cost in Forge's notation (\"1 W\", \"R\", \"X G\"). Hand lists render it as symbols."
          type: "string"
        name:
          type: "string"
        owner:
          maximum: 255
          minimum: 0
          type: "integer"
        paired:
          maximum: 4294967295
          minimum: 0
          type: "integer"
        play_main1:
          description: "PlayMain1 is the canonical Forge `SVar:PlayMain1` timing hint: \"ALWAYS\", \"TRUE\" (cast in the first main while the caster controls a creature) or \"OPPONENTCREATURES\" (while an opponent does), and \"\" for no hint. It is a printed deck-builder hint of a visible card, never hidden information. The opt-in AIHints cast rule reads it; the default bot ignores it."
          type: "string"
        power:
          format: "int32"
          type: "integer"
        printed_pt:
          description: "PrintedPT is the face's PRINTED power/toughness as text (\"1/1\", \"*/*\"), the value the physical card or token is printed with. Power/Toughness above are the CURRENT layer-7 values a counter or an anthem moves; a token whose current P/T differs from its printed P/T (a 1/1 Soldier with a +1/+1 counter reads \"2/2\") must still resolve to the same art as its un-pumped sibling, and only the printed value is stable across pumping. Empty for a face with no printed P/T (a noncreature) and on every redacted face-down CardView, which is rebuilt from a fresh literal."
          type: "string"
        printing:
          $ref: "#/components/schemas/Printing"
          description: "Printing is what an image lookup keys on; Token (\"#12\") tells two copies of one card apart in the stack, the log and an arrow."
        produces:
          $ref: "#/components/schemas/ManaProduction"
          description: "Produces is what this card's mana abilities add to the pool when a tap-for-mana activation runs them, derived from the compiled abilities (cards.Face.ManaProduction) rather than land subtypes: a basic land's intrinsic {W}, a dual's {W}{U}, an \"add any colour\" source's five colour alternatives (one unit each, flagged Any -- the colour is chosen when it is tapped, CR 106.1b), a colourless rock's {C}{C}. nil when the card has no mana ability at all, so a creature or a spell never pays for the six-entry array on the wire. It is a projected characteristic like ManaCost and Keywords -- a mana ability's production is a card fact every seat sees, and it is projected for the same zones the card itself is visible in. This is what the bot policy's colour-aware tap and land heuristics read (carried into botpolicy.Card as plain data, never the view type)."
        pump_own_combatants:
          description: "PumpOwn reports whether that Pump ability's target filter can name both the caster's own attacking and blocking creatures (effects.CastPumpOwnCombatants). It is true for an unrestricted creature filter and false for a narrowed one -- attacking-only, blocking-only, a colour/type/state restriction, or an opponent-only scope. The A6 pump timing rule holds a literal pump it cannot aim at its own combatants rather than casting it into the ordinary target ranking. Only meaningful when PumpPower or PumpToughness is positive; a false answer there means \"not a pump the rule governs\"."
          type: "boolean"
        pump_power:
          description: "PumpPower and PumpToughness are the literal, non-negative bonus of the card's primary Pump ability (effects.CastPumpBonus), both 0 for every shape the cast policy does not read: a curse, a mixed-sign or dynamic amount, a non-creature target, an opponent-only target scope, or a non-Pump spell. They are printed facts of a visible card, like RemovalDamage, and the opt-in A6 pump timing rule reads them to decide whether a combat trick can change a combat. A 0 answers \"not a literal creature pump\", never \"pumps for zero\"."
          format: "int32"
          type: "integer"
        pump_toughness:
          format: "int32"
          type: "integer"
        removal_damage:
          description: "RemovalDamage is the literal NumDmg$ of that same removal ability when it is a plain integer, 0 when it is absent, dynamic ({X}, an SVar) or not positive. Like RemovalKind it is a printed card fact of a visible card. The hold rule reads it as the spell's damage against an opponent's projected life: a literal damage figure at or above a player's life total is a lethal face target, so the removal is worth firing now. A 0 answers \"unknown\", never \"no damage\" -- the policy treats an unknown figure as no face candidate at all."
          format: "int32"
          type: "integer"
        removal_kind:
          description: "RemovalKind names the one-shot removal shape of SpellAPI: \"destroy\", \"damage\", or \"bounce\". Empty means the card is not one of the shapes the cast policy holds. It is derived from the same printed ability SpellAPI names, so it is a visible card fact, never hidden information."
          type: "string"
        removal_targets:
          description: "RemovalTargets is the coarse target scope of that same removal ability, read off its ValidTgts$ alternatives' base tokens: \"creature\" when they name creatures and no players, \"player\" when they name players and no creatures, \"any\" when they name both, and \"\" when they name neither (an artifact or land destruction spell, a graveyard move). It is derived from the same printed ability as RemovalKind and never set without it, so it is a visible card fact. The bot policy's removal-now hold rule reads it to know whether a spell could even aim at a creature (the threat gate) or at a player (the lethal-face shortcut)."
          type: "string"
        remove_deck:
          description: "RemoveDeck reports that the card carries an `AI:RemoveDeck` deck-builder hint (Forge's \"the AI does not know how to play this card\"). It is a printed fact of a visible card, projected so the opt-in AIHints cast policy can veto it; the default bot ignores it."
          type: "boolean"
        spell_api:
          description: "SpellAPI is the API of the card's primary cast-shape ability (its SP$ line -- \"Counter\" for Counterspell, \"DealDamage\" for Lightning Bolt, \"\" for a card with no spell ability, which is every creature and every activated-ability permanent). It is a printed card fact, projected for exactly the cards the projection already carries the printed ManaCost and Types of -- a visible card's own text is open information -- so a seat that can read a card's cost can read what the cast does at the same grain. The bot policy's casting rule reads it (carried into botpolicy.Card.Counter) to tell a counter spell from any other cast. A hidden hand's cards are never projected as CardViews at all, so this never leaks hidden information."
          type: "string"
        summon_sick:
          type: "boolean"
        tapped:
          type: "boolean"
        token:
          type: "string"
        toughness:
          format: "int32"
          type: "integer"
        types:
          type: "string"
      required:
        - "attacking"
        - "controller"
        - "damage"
        - "id"
        - "name"
        - "owner"
        - "power"
        - "printing"
        - "summon_sick"
        - "tapped"
        - "token"
        - "toughness"
        - "types"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/engine/view.CardView"
    CreateEventRequest:
      description: "CreateEventRequest is the POST /api/events body: the drafted set, the series format and the four seats. BestOf is 1 or 3 (0 = 1). PickTimer is \"\", \"off\", \"standard\" or \"relaxed\". The seed is always minted by the server; no client field may choose it."
      properties:
        best_of:
          format: "int64"
          type: "integer"
        pick_timer:
          type: "string"
        seats:
          items:
            $ref: "#/components/schemas/CreateEventSeat"
          type:
            - "array"
            - "null"
        set:
          type: "string"
      required:
        - "seats"
        - "set"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.CreateEventRequest"
    CreateEventResponse:
      description: "CreateEventResponse is the POST /api/events reply: the event id, one invite per seat and the event's initial state."
      properties:
        event:
          type: "string"
        invites:
          items:
            $ref: "#/components/schemas/EventInvite"
          type:
            - "array"
            - "null"
        state:
          $ref: "#/components/schemas/EventState"
      required:
        - "event"
        - "invites"
        - "state"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.CreateEventResponse"
    CreateEventSeat:
      description: "CreateEventSeat is one seat of a CreateEventRequest. Kind is \"human\" or \"bot\"; Policy names the bot's game policy (\"\" = server default) and Drafter the pickbot persona (\"\" = \"rating-colour\")."
      properties:
        drafter:
          type: "string"
        kind:
          type: "string"
        policy:
          type: "string"
      required:
        - "kind"
      type: "object"
      x-go-type: "github.com/adams-shaun/gorge/server/protocol.CreateEventSeat"
    CreateGameRequest:
      description: "CreateGameRequest is the POST /api/games body. Deck ids are optional: an omitted id leaves that seat's assignment to the server, preserving the original random flow. They are filename stems from GET /api/decks."
      properties:
        bot_deck:
