# Build the container demo image (deploy/docker) on a push to main, and push it
# to Docker Hub only when the repository has the DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN secrets. Without them the job still builds, so a broken
# Dockerfile fails here. The image name comes from the DEMO_IMAGE repository
# variable (default gorge/gorged-demo); the namespace must be one the account
# can push to.
name: demo-image

on:
  push:
    branches: [main]
    paths:
      - deploy/docker/**
      - web/**
      - server/gorged/**
      - cmd/gorged/**
      - Makefile
      - .github/workflows/demo-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DEMO_IMAGE || 'gorge/gorged-demo' }}
      HAVE_HUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the corpus pin
        id: pin
        run: echo "ref=$(sed -n 's/^FORGE_REF *?= *\([0-9a-f]\{40\}\).*/\1/p' Makefile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.HAVE_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the gorged image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: gorged
          build-args: FORGE_REF=${{ steps.pin.outputs.ref }}
          push: ${{ env.HAVE_HUB == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: proxy
          push: ${{ env.HAVE_HUB == 'true' }}
          tags: |
            ${{ env.IMAGE }}-proxy:latest
            ${{ env.IMAGE }}-proxy:${{ github.sha }}
