      - name: Read the corpus pin
        id: pin
        run: echo "forge_ref=$(awk '/^FORGE_REF/ {print $3}' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: .cards
          key: cards-${{ steps.pin.outputs.forge_ref }}-${{ hashFiles('engine/cards/**/*.go') }}
          restore-keys: cards-${{ steps.pin.outputs.forge_ref }}-
      - name: Fetch and compile the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: make fetch-cards compile-cards
      - name: Refuse to run without the corpus
        run: |
          test -s .cards/cards.lock || { echo "no .cards corpus: every corpus test would skip"; exit 1; }
          grep -q "${{ steps.pin.outputs.forge_ref }}" .cards/cards.lock || { echo ".cards is not at FORGE_REF"; cat .cards/cards.lock; exit 1; }
      - name: Restore the Go cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: gocache-dirac-slices-${{ github.sha }}
          restore-keys: gocache-dirac-slices-
      - name: Build dirac's card tables
        run: make dirac-tables
      - name: Stable mtimes for the Go test cache
        run: bash scripts/ci-stable-mtimes.sh .
      - name: Test part ${{ matrix.part }} of 10
        run: bash scripts/ci-oracle-shard.sh ${{ matrix.part }} 10 -timeout 30m
      - name: Disk left
        if: always()
        run: df -h .

  # The browser gate (scripts/smoke.sh): the built client against real servers, including a seated
  # game on each engine over each wire. Not in ci-ok until it has gone green once here: the
  # maintainers' machines don't run npm, so nothing proved this job before CI did.
  browser:
    needs: prior
    if: ${{ !cancelled() && needs.prior.outputs.passed != 'true' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: "24"
      - name: Read the corpus pin
        id: pin
        run: echo "forge_ref=$(awk '/^FORGE_REF/ {print $3}' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: .cards
          key: cards-${{ steps.pin.outputs.forge_ref }}-${{ hashFiles('engine/cards/**/*.go') }}
          restore-keys: cards-${{ steps.pin.outputs.forge_ref }}-
      - name: Fetch and compile the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: make fetch-cards compile-cards
      - name: Refuse to run without the corpus
        run: |
          test -s .cards/cards.lock || { echo "no .cards corpus: every corpus test would skip"; exit 1; }
          grep -q "${{ steps.pin.outputs.forge_ref }}" .cards/cards.lock || { echo ".cards is not at FORGE_REF"; cat .cards/cards.lock; exit 1; }
      - name: Restore the Go cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: gocache-browser-${{ github.sha }}
          restore-keys: gocache-browser-
      - name: Restore npm's cache, the installed client and the browser
        id: webcache
        uses: actions/cache/restore@v4
        with:
          # web/node_modules is the product of `npm ci` for exactly this lockfile
          # and Node version. Cache it so a hit skips the install (measured
          # 38-52 s of npm ci here, 11-26) instead of re-extracting the tree;
          # a miss saves it on main, after npm ci produced it. The key is the
          # lockfile hash plus the version setup-node resolved, so a dependency
          # or toolchain change is always a miss: a hit cannot serve stale,
          # mismatched content.
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            web/node_modules
          key: web-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install the client's dependencies
        # A cache hit restored web/node_modules exactly as `npm ci` leaves it for
        # this lockfile and Node version; there is nothing to install.
        if: steps.webcache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web
      - name: Install Chromium's system libraries
        # security.ubuntu.com has stopped answering GitHub's runners; the Azure archive mirror
        # carries the same -security pocket. apt reaches a network mirror, so it is retried
        # once: one transient mirror/DNS blip in this step failed a whole merge-queue batch
        # (46025989080, 11-27) while every adjacent batch passed it. A second consecutive
        # failure still fails the job — only one retry, so a real break is not hidden.
        run: |
          sudo grep -rl security.ubuntu.com /etc/apt/ | xargs -r sudo sed -i 's#http://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g'
          npx playwright install-deps chromium || {
            echo "::warning::install-deps failed once (transient apt/mirror); retrying"
            sleep 15
            npx playwright install-deps chromium
          }
        working-directory: web
      - name: Run the browser gate
        run: make smoke
      - name: Keep the failures' traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: web/test-results
          if-no-files-found: ignore
      - name: Save npm's cache, the installed client and the browser
        # Save must use the restore step's exact key and paths, or the next
        # batch's restore misses forever.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.webcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            web/node_modules
          key: web-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json') }}
      - name: Save the Go cache
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: gocache-browser-${{ github.sha }}

  # The web client's unit tests (vitest), svelte-check and eslint, on every pull request that
  # touches web/ and on every queue batch; a pull request that does not touch web/ skips the steps
  # and ends green in seconds. Advisory until it has been green on main for a week; then it joins
  # ci-ok (the browser job's rule: nothing proved this job before CI did).
  web-unit:
    needs: prior
    if: ${{ !cancelled() && needs.prior.outputs.passed != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does the diff touch web/
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" -- web/ | /usr/bin/grep -q .; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web/ untouched: skipping the web unit tests"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.web == 'true'
        id: node
        with:
          node-version: "24"
      - name: Restore npm's cache, the installed client and the browser
        # The browser job's cache: same key and paths, saved by that job on main.
        if: steps.changed.outputs.web == 'true'
        id: webcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            web/node_modules
          key: web-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install the client's dependencies
        if: steps.changed.outputs.web == 'true' && steps.webcache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web
      - name: Install Chromium's system libraries
        # The suite's browser-backed files share one Chromium (web/src/test/browser.global.ts);
        # pretest (scripts/ensure-playwright.sh) installs the browser itself. The mirror swap and
        # single retry are the browser job's, for the same apt flakiness.
        if: steps.changed.outputs.web == 'true'
        run: |
          sudo grep -rl security.ubuntu.com /etc/apt/ | xargs -r sudo sed -i 's#http://security.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g'
          npx playwright install-deps chromium || {
            echo "::warning::install-deps failed once (transient apt/mirror); retrying"
            sleep 15
            npx playwright install-deps chromium
          }
        working-directory: web
      - name: svelte-check
        if: steps.changed.outputs.web == 'true'
        run: npm run check
        working-directory: web
      - name: eslint
        if: steps.changed.outputs.web == 'true'
        run: npm run lint
        working-directory: web
      - name: Unit tests (vitest)
        if: steps.changed.outputs.web == 'true'
        run: npm test
        working-directory: web

  # One required check to name in branch protection, whatever the shard count.
  ci-ok:
    if: always()
    needs: [prior, fast, lint, test, examples, wire-matrix, wire-nightly, dirac-slices, dirac-repros, oracle-sentinels, oracle]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          # A push to main whose tree a queue batch or pull request passed (prior) skips the heavy jobs.
          heavy=success fast=skipped lint=success
          if [ "${{ needs.prior.outputs.passed }}" = true ]; then heavy=skipped lint=skipped; fi
          # Two-step CI: a pull request (not a Mergify queue batch) runs the fast stage instead of the heavy jobs.
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ startsWith(github.head_ref, 'mergify/merge-queue/') }}" != true ]; then heavy=skipped fast=success; fi
          # oracle runs on demand only (about every 2 hours in oracle.yml); dirac-slices runs everywhere.
          # The nightly wire chunks are schedule-only, like the step they replaced.
          oracle=skipped slices=$heavy nightly=skipped
          case "${{ github.event_name }}" in
            workflow_dispatch) oracle=success ;;
            schedule) nightly=success ;;
          esac
          [ "${{ needs.lint.result }}" = "$lint" ] && [ "${{ needs.fast.result }}" = "$fast" ] && [ "${{ needs.test.result }}" = "$heavy" ] && [ "${{ needs.examples.result }}" = "$heavy" ] && [ "${{ needs.wire-matrix.result }}" = "$heavy" ] && [ "${{ needs.wire-nightly.result }}" = "$nightly" ] && [ "${{ needs.dirac-slices.result }}" = "$slices" ] && [ "${{ needs.dirac-repros.result }}" = "$slices" ] && [ "${{ needs.oracle-sentinels.result }}" = "$slices" ] && [ "${{ needs.oracle.result }}" = "$oracle" ] || { echo "prior=${{ needs.prior.outputs.passed }} fast=${{ needs.fast.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }} examples=${{ needs.examples.result }} wire-matrix=${{ needs.wire-matrix.result }} wire-nightly=${{ needs.wire-nightly.result }} dirac-slices=${{ needs.dirac-slices.result }} dirac-repros=${{ needs.dirac-repros.result }} oracle-sentinels=${{ needs.oracle-sentinels.result }} oracle=${{ needs.oracle.result }}"; exit 1; }
      # A pull request or queue batch that passed records the tree it passed, so the push that merges it can skip a rerun
      # (prior, above). Best effort: a failure here only means that push runs everything.
      - name: Read the tree this pull request passed
        id: tree
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          [ -n "$tree" ]
          echo "$tree" > passed-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Record it
        if: steps.tree.outcome == 'success' && steps.tree.outputs.tree != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-passed-tree-${{ steps.tree.outputs.tree }}
          path: passed-tree.txt
          retention-days: 14
