        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.corpus.outputs.cache-hit != 'true' && matrix.shard == 0
        uses: actions/cache/save@v4
        with:
          path: .cards
          key: cards-${{ steps.pin.outputs.forge_ref }}-${{ hashFiles('engine/cards/**/*.go') }}
      - name: Restore the Go cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: gocache-test${{ matrix.shard }}-${{ github.sha }}
          restore-keys: gocache-test${{ matrix.shard }}-
      - name: Build dirac's card tables
        run: |
          # On the box, ci-corpus.sh built this tree's tables once and .cards holds them; elsewhere build them here.
          if [ "${{ runner.environment }}" != self-hosted ]; then make dirac-tables; fi
      - name: Stable mtimes for the Go test cache
        run: bash scripts/ci-stable-mtimes.sh .
      - name: Compile this shard's test binaries
        if: runner.environment == 'self-hosted'
        # S1b (11-26): prepare compiled what two or more jobs need; this shard's own test binaries and
        # the libraries only its closure imports compile here, at the head of its own job, off prepare's
        # serial path. go test reuses go test's cached work, and no compile action has two jobs racing
        # for it (the 11-17 six-shard fan-out paid 127.5 s of work for one tree against prepare's 53.4 s
        # here; the split pays 40.8 s across six jobs that run beside each other). -exec /bin/true runs
        # no tests. GitHub-hosted runners already compile per shard in the test step below and keep
        # their own Actions cache.
        run: |
          pkgs=$(bash scripts/ci_shard.sh ${{ matrix.shard }} "$SHARDS" | sed 's/#[A-Z]$//' | sort -u)
          if [ -n "$pkgs" ]; then
            # shellcheck disable=SC2086
            go test -exec /bin/true $pkgs >/dev/null
          fi
      - name: Test shard ${{ matrix.shard }} of ${{ env.SHARDS }}
        env:
          # Load is 55-90 on 32 threads with 6 runners x go -p=4 test binaries, each defaulting to GOMAXPROCS=32. The
          # test budget is 4 vCPU per test (AGENTS.md). Measured 11-20 (8 batches before #2534, 15 after): the sum of
          # per-package median times fell 4064 -> 2862 s, engine/rules 458 -> 242 s; only dirac and dirac/shadow grew.
          GOMAXPROCS: "8"
        run: bash scripts/ci-infra-retry.sh --log test-shard.log --name "test shard ${{ matrix.shard }}" -- bash scripts/ci-test-shard.sh ${{ matrix.shard }} "$SHARDS"
      - name: Golden chain heads
        # Not shard 0: it holds engine/rules (181 s) and set the batch's wall time. Pin it to the lightest shard;
        # ci_shard.sh has no weight for this step, so the pin lives here. It recompiles engine/rules in whatever
        # shard it lands, so place it where that (~15 s compile + 14 s TestHeads) fits under the gate.
        # 11-27 (speed-S7): the 11-20 premise (shard 5, 145-465 pkg-seconds) no longer holds. In queue batch
        # 45936102895 shard 5 held de-facto dirac/kgen (182 s), bots/azmcts (176 s) and engine/effects (167 s)
        # and its job ran 311 s, the batch's gate; this step's 28 s sat after the test body on the critical path.
        # Shard 4 was the lightest (130 s of a 311 s tail), so the same work moved off the gate.
        if: matrix.shard == 4
        run: go test -timeout 10m -run '^TestHeads$' ./engine/rules
      - name: Save the Go cache
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: gocache-test${{ matrix.shard }}-${{ github.sha }}

