          solo() { local log=$1; shift; go test "$@" >"$log" 2>&1 & pids+=($!); logs+=("$log"); }
          has() { printf '%s\n' $pkgs | grep -qx "$1"; }
          if has "$kgen"; then solo kgen-test.log -count=1 $tags -timeout 20m -skip '^(TestHeads)$' "$kgen"; fi
          while IFS=$'\t' read -r sp rx; do
