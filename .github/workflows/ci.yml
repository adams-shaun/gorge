# CI gate for pull requests to main (from this repo's branches and from forks), for
# Mergify merge-queue batches (mergify/merge-queue/*) and for pushes to main. A pull
# request runs only the fast stage (`fast`, `lint`); the queue batch runs the full
# suite; see .mergify.yml.
#
# Affected packages only, by Go's own cache: GOCACHE holds both the build cache
# and the test-result cache, and it is restored from the newest run on the base
# branch. `go test` then re-runs only the packages whose inputs changed (sources,
# dependencies, env, files a test opened) and reports the rest as "(cached)".
# The nightly schedule runs with the cache bypassed (-count=1) so a stale cached
# result cannot hide indefinitely.
#
# The Forge corpus (GPL-3.0, never committed) is fetched at the Makefile's
# FORGE_REF into the gitignored .cards/ and cached by that pin. A run with no
# corpus would SKIP every corpus test and read green, so the job fails instead.
#
# Fork PRs get a read-only token and no secrets; nothing here needs either.
#
# Runner: pull_request jobs from forks ALWAYS run on GitHub-hosted runners; same-repo PRs use gorge-box when CI_SELF_HOSTED. Push, schedule
# and dispatch jobs run on the maintainers' ephemeral k8s runners (label
# gorge-box) when the repository variable
# CI_SELF_HOSTED is 'true', and on GitHub-hosted runners otherwise. The fork-PR
# approval policy is all_external_contributors, so a fork cannot retarget a
# job onto gorge-box without the owner approving that run.
# Caches are SAVED only from main (its pushes, the schedule and dispatches on main),
# so a PR reads main's cache and never writes one, and no other branch's save can
# evict main's from the repository's cache budget.
#
# A push to main whose tree a queue batch or pull request already passed runs only lint. A pull request
# runs on refs/pull/N/merge, the PR's head merged into main; merging the PR (merge,
# squash or rebase) while main has not moved since that run pushes a commit with the
# same tree. ci-ok on a passing PR to main uploads an artifact (the tree sha) named
# ci-passed-tree-<tree sha>; the push's `prior` job looks that name up and, when a
# same-repository run (not a fork's) holds it, the heavy jobs skip and ci-ok accepts
# them skipped. Any lookup failure, a moved main, a hand push, the schedule and a
# dispatch all run everything, as before. The cost: a skipped push saves no test
# cache, so a PR's shards restore the newest one main did save (a push that ran, or
# the nightly's build cache).
name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The nightly (schedule) run has its own group and is never cancelled: sharing refs/heads/main with push runs let
  # every merge cancel it, and 11-16..11-18 all three nightlies were cancelled, so the ManaBrew and SpellBench
  # wire tests (build tags, nightly only) ran nowhere and TestSyntheticPromptsOverStream sat red on main unseen.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  SHARDS: 6
  # One build/test cache per box, not per runner directory (without -trimpath
  # the cache keys include /opt/actions-runner-N/_work). tsgen sets GOROOT itself.
  GOFLAGS: -p=4 -trimpath

# Runner priority (operator 11-16: "the mergify queue checks run w/ higher prio"): GitHub Actions has no job
# priority, so a pull request's own checks (fast, lint) run only on the runners labelled gorge-pr (on the owned box and the spot boxes). The others
# box runners always stay free for Mergify's queue batches (mergify/merge-queue/*), main, nightly and on demand.
jobs:
  # A push to main only: did a queue batch or pull request's ci-ok already pass this exact tree?
  prior:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          if tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha) && [ -n "$tree" ] &&
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-tree-$tree&per_page=100" \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | length'); then
            [ "${n:-0}" -gt 0 ] && passed=true
          fi
          echo "tree ${tree:-unknown}: passed by a promote PR: $passed"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  # Stage 1 of the pipeline: on the box, build the corpus and dirac's tables once for this tree (scripts/ci-corpus.sh
  # keys them by FORGE_REF, engine/cards and dirac sources); the test stage's jobs then find them built. A box
  # without the tree (a fresh spot instance) first tries the Actions cache under cardstree-<ck>-<dk>-<RULE>, the key
  # of every input the tree's bytes depend on (scripts/ci-corpus-keys.sh); on a miss it builds and, from main, saves.
  # On a GitHub-hosted runner it does nothing: each hosted job restores .cards from the Actions cache.
  prepare:
    needs: prior
    if: ${{ !cancelled() && needs.prior.outputs.passed != 'true' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    # Once per box: the corpus and tables for this tree, then the compile work two or more jobs share — a
    # small representative set's test binaries plus ./dirac/oracle — into the box's shared Go cache (its
    # runners share ~/.cache/go-build); every shard's own binaries compile in that shard's job. 11-17: six
    # shards on a box compiled the same changed packages at once, and test (0) spent ~6 min compiling for
    # 97 s of kgen tests; one owner per compile action is what keeps that from coming back.
    strategy:
      matrix:
        # The boxes come from the repo variable CI_BOXES (a JSON list of box names), so adding or
        # dropping a box is `gh variable set CI_BOXES`, never a PR. Every listed box must have a gorge-box runner.
        # An empty list falls back to the repo variable CI_BOX_DEFAULT, and with that unset too, to any gorge-box runner
        # (box names are local state and stay out of this public tree, 11-28). The fallback exists because 11-26 10:0x-11:11 CI_BOXES expanded to no box, prepare got
        # zero matrix jobs, test/wire-matrix/dirac-slices all skipped and ci-ok reddened four batches in a row
        # (runs 45802945687, 45803903089, 45807210008, 45807737930) while nothing merged for 2 h. The suite must
        # run somewhere even then; CI_BOXES='[]' is not a way to pause batch CI (set CI_SELF_HOSTED instead).
        box: ${{ fromJSON((vars.CI_BOXES != '' && vars.CI_BOXES != '[]' && vars.CI_BOXES) || format('["{0}"]', vars.CI_BOX_DEFAULT)) }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(matrix.box != '' && format('["gorge-box","box-{0}"]', matrix.box) || '["gorge-box"]') || 'ubuntu-24.04' }}
    steps:
      - name: Heal the runner's workspace (self-hosted)
        # 11-21: metal-gorge-box-4's workspace ref store broke ("fetching ref refs/remotes/origin/main failed: reference
        # already exists") and turned 13+ PRs' fast and lint red. Before checkout, as the runner user: a repository whose
        # refs do not list, or whose objects fail a quick connectivity check, is deleted, so checkout clones afresh.
        # Otherwise only stale lock files go: a healthy workspace keeps its refs, so checkout fetches incrementally (deleting
        # refs/remotes on every run made checkout re-fetch every ref: 27-31 s per job, 11-21). A checkout that still fails
        # removes .git and checks out again (the steps after it). No network check:
        # a fetch from the workspace hangs once checkout has removed its auth header, and timed out on every healthy
        # runner (20 s, then a full re-clone; 11-21).
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          ws=$GITHUB_WORKSPACE g=$GITHUB_WORKSPACE/.git
          [ -d "$g" ] || exit 0
          why=
          timeout 10 git -C "$ws" for-each-ref >/dev/null 2>&1 || why="for-each-ref failed"
          if [ -z "$why" ]; then
            rc=0; timeout 2 git -C "$ws" fsck --connectivity-only --no-dangling >/dev/null 2>&1 || rc=$?
            case $rc in 0 | 124) ;; *) why="fsck failed ($rc)" ;; esac   # 124: over 2 s, not a verdict
          fi
          if [ -n "$why" ]; then echo "::warning::workspace git store broken ($why): removing $g"; rm -rf "$g"; exit 0; fi
          find "$g" -name '*.lock' -mmin +5 -delete 2>/dev/null || true
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: ${{ runner.environment == 'self-hosted' }}
        if: runner.environment == 'self-hosted'
      - name: Re-clone a broken workspace (self-hosted)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::checkout failed in this runner's workspace: removing its .git for a fresh clone"
          rm -rf "$GITHUB_WORKSPACE/.git"
      - uses: actions/checkout@v4
        if: steps.checkout.outcome == 'failure'
      - uses: actions/setup-go@v5
        # Unconditional so the shard-split assertion below has go on a GitHub-hosted prepare too. The self-hosted
        # path pays ~0.1-0.5 s for it (measured in the job's step timestamps); the hosted path installs the
        # go.mod toolchain, which its image may not carry.
        with:
          go-version-file: go.mod
          cache: false
      - name: Every test package is on exactly one shard (GitHub-hosted)
        # ci_shard.sh's comment says `all` "is how the self-check in CI proves no package was dropped"; scripts/
        # ci-shard-check.sh is that check, and it was missing from every workflow. A package that falls out of all
        # shards never runs, and a green batch where a test never ran is indistinguishable from one where it
        # passed; a package placed twice runs twice. On a self-hosted box the check runs beside the corpus/tables
        # build and the shared compile in the step below (speed-S1, 11-28): it needs only `go list` and touches
        # neither .cards nor the build cache, so its measured 2.1-5.3 s per box (merge-queue batches 46149285673,
        # 46147513195, 46146677244) no longer sits in front of prepare's long pole. A failure still fails prepare
        # — that step waits on it — so the test shards (which need prepare) never start. A GitHub-hosted prepare
        # has no corpus step, so the check stays a step here.
        if: runner.environment == 'github-hosted'
        run: bash scripts/ci-shard-check.sh "$SHARDS"
      - name: Corpus keys (self-hosted)
        if: runner.environment == 'self-hosted'
        id: keys
        run: |
          # scripts/ci-corpus-keys.sh is the single definition of the corpus keys; ci-corpus.sh sources it.
          # tree-present: this box already holds a complete tree for this key, so the restore below (hundreds of
          # MB off the cache service) runs only where the alternative is fetching and building from scratch.
          eval "$(bash scripts/ci-corpus-keys.sh)"
          present=false
          if [ -e "$tree/.tables-ok" ]; then present=true; fi
          {
            echo "ck=$ck"
            echo "dk=$dk"
            echo "rule=$RULE"
            echo "tree=$tree"
            echo "tree-present=$present"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the corpus tree (self-hosted)
        id: treerestore
        # Fail-open: a cache-service hiccup costs the tree build, never a red batch.
        continue-on-error: true
        if: runner.environment == 'self-hosted' && steps.keys.outputs.tree-present != 'true'
        uses: actions/cache/restore@v4
        with:
          # Workspace-local, so two prepares on one box cannot race one extraction; ci-corpus.sh installs it as
          # the box's tree under its own lock.
          path: .cards-restore
          # The key, no restore-keys: it is the tree's every input (FORGE_REF, engine/cards, everything kgen is
          # built from, and the reuse rule), so a partial match could only serve tables another tree built — the
          # 11-21 failure mode.
          key: cardstree-${{ steps.keys.outputs.ck }}-${{ steps.keys.outputs.dk }}-${{ steps.keys.outputs.rule }}
      - name: Discard a partial corpus restore (self-hosted)
        if: runner.environment == 'self-hosted' && steps.treerestore.outcome == 'failure'
        run: rm -rf .cards-restore
      - name: Corpus and tables, and the shared compile beside them
        if: runner.environment == 'self-hosted'
        # S1d (11-26): this step is what every test job waits for, and the shared compile in it is its largest
        # part — 148.5 s of prepare's 192 s in batch 45774650152 (gh run view 45774650152 --log --job
        # 139755268219 step timestamps), and 141-148 s of prepare's 156-192 s across 11-26's spot boxes. It ran
        # on the workflow-wide GOFLAGS -p=4: four package builds at a time on a 32-thread box, so 28 of 32 lanes
        # sat idle for the whole stage while the shards queued behind it. Nothing else on the box compiles these
        # packages meanwhile (the shards are blocked on this job; a second overlapping batch adds its own 12),
        # so -p=12 uses otherwise-idle lanes to cut the compile to roughly a third. GOMAXPROCS=8 (the shards'
        # value) caps kgen's own workers on the corpus build that runs beside the compile, so the two fit the box
        # together. -exec /bin/true builds and runs no tests, so the 4-vCPU per-test budget (AGENTS.md) is
        # untouched — this only changes how many packages the go command builds at once.
        env:
          GOFLAGS: -p=12 -trimpath
          GOMAXPROCS: "8"
        # S1c (11-26), measured from five green merge-queue batches (gh run view <run> --log --job <job> step
        # timestamps, box load ~89 on 32 threads): this job had two serial steps, the corpus/tables build
        # (1-67 s: 1-4 s on a tree the box already built, ~25-67 s when this tree first reached the box)
        # and the shared compile (17-87 s: a batch's merge moves packages, so it is never a no-op). The
        # stage is the slowest box's job: 161, 111, 83, 68, 46 s over those five batches, and the compile
        # was the largest step in every one. The compile reads only the checkout and the box's Go cache —
        # never .cards, which ci-corpus.sh is about to link — so it does not wait for tables it does not
        # read. Running both in one job makes the step max(corpus, compile) instead of their sum: predicted
        # 161 -> ~100, 111 -> ~74, 83 -> ~48, 68 -> ~58, 46 -> ~46 s (after = predicted; the next green
        # batch confirms it). Both stay in this one job on this box, so each box still warms only its own
        # corpus tree and Go cache, and the compile is still the single owner of the shared set (each test
        # shard compiles its own package list in the test stage).
        run: |
          # -exec /bin/true builds and vets each test binary and runs none of them.
          # <package>#<label> is a split package's extra entry (ci_shard.sh, scripts/ci-splits.tsv), the same package.
          pkgs=$(bash scripts/ci_shard.sh all "$SHARDS" | awk '{print $2}' | sed 's/#[A-Z]$//' | sort -u)
          # S1b (11-26): compile only what two or more jobs need, not every shard's leaf: the heaviest
          # package of each top-level directory (the balancer's own weights, scripts/ci-pkg-times.tsv,
          # default 3 as ci_shard.sh's) — 11 packages whose test builds cover 95 of the 118 repo packages
          # two or more shard closures share (measured at tree 61f994c1fc); the rest compile lazily in
          # the first shard that needs them. ./dirac/oracle stays here: ci_shard.sh leaves it out and the
          # sentinels, slices and repros read it warm. Each shard's own binaries compile at the head of
          # that shard's job (the test stage's compile step). The split rides go test's cache identity —
          # a go build does not serve a later go test (shard 2's warm-up was still 25.6 s of its 31.9 s
          # after a go build of the shared set, but 2.1 s after another shard's go test) — so no package
          # compiles twice, which is what killed the 11-17 fan-out. -exec /bin/true runs no tests.
          repkgs=$(awk -F'\t' 'NR==FNR { if ($1 !~ /^#/ && NF >= 2) w[$1] = $2 + 0; next }
            { n = split($1, a, "/"); top = n < 4 ? $1 : a[1] "/" a[4]
              wt = ($1 in w) ? w[$1] : 3
              if (!(top in best) || wt > bw[top]) { best[top] = $1; bw[top] = wt } }
            END { for (t in best) print best[t] }' scripts/ci-pkg-times.tsv <(printf '%s\n' "$pkgs") | sort)
          # shellcheck disable=SC2086
          go test -exec /bin/true $repkgs ./dirac/oracle >/dev/null &
          compile=$!
          # speed-S1 (11-28): the shard-split gate needs only `go list` and touches neither .cards nor the build
          # cache the compile writes, so it runs beside them instead of in front of them. The wait below still
          # fails this step (and so prepare) if the gate fails; the test shards need prepare and never start.
          bash scripts/ci-shard-check.sh "$SHARDS" &
          check=$!
          rc=0
          # A tree restored from the Actions cache (above) installs as the box's tree instead of a fetch and a
          # fresh make dirac-tables; a warm box (tree-present) skipped the restore and has nothing here.
          if [ -d .cards-restore ]; then export CI_CORPUS_RESTORE=.cards-restore; fi
          bash scripts/ci-corpus.sh || rc=$?
          rm -rf .cards-restore
          wait "$compile" || rc=$?
          wait "$check" || rc=$?
          exit "$rc"
      - name: Save the corpus tree (self-hosted)
        # Main only, the workflow's cache policy (a PR reads main's cache and never writes one). Publishes the
        # tree under its exact key for a fresh box; a duplicate key is a cheap no-op. A queue batch is a pull
        # request and cannot save, so the entry refreshes with main's own prepares — the nightly, and any push or
        # dispatch prepare prior did not skip.
        continue-on-error: true
        if: runner.environment == 'self-hosted' && steps.treerestore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          # .cards is hard links to the tree: the archive is the tree's content without a second copy on disk.
          path: .cards
          key: cardstree-${{ steps.keys.outputs.ck }}-${{ steps.keys.outputs.dk }}-${{ steps.keys.outputs.rule }}

  # Two-step CI (Mergify): a pull request runs only this fast stage, the diff's packages and the tests that
  # import them (scripts/ci-fast.sh). The full suite runs once per queue batch, on mergify/merge-queue/* branches,
  # and on main, nightly and on demand.
  fast:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') && !startsWith(github.head_ref, 'hotfix/') && 'gorge-pr' || 'gorge-box') || 'ubuntu-24.04' }}
    steps:
      - name: Heal the runner's workspace (self-hosted)
        # 11-21: metal-gorge-box-4's workspace ref store broke ("fetching ref refs/remotes/origin/main failed: reference
        # already exists") and turned 13+ PRs' fast and lint red. Before checkout, as the runner user: a repository whose
        # refs do not list, or whose objects fail a quick connectivity check, is deleted, so checkout clones afresh.
        # Otherwise only stale lock files go: a healthy workspace keeps its refs, so checkout fetches incrementally (deleting
        # refs/remotes on every run made checkout re-fetch every ref: 27-31 s per job, 11-21). A checkout that still fails
        # removes .git and checks out again (the steps after it). No network check:
        # a fetch from the workspace hangs once checkout has removed its auth header, and timed out on every healthy
        # runner (20 s, then a full re-clone; 11-21).
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          ws=$GITHUB_WORKSPACE g=$GITHUB_WORKSPACE/.git
          [ -d "$g" ] || exit 0
          why=
          timeout 10 git -C "$ws" for-each-ref >/dev/null 2>&1 || why="for-each-ref failed"
          if [ -z "$why" ]; then
            rc=0; timeout 2 git -C "$ws" fsck --connectivity-only --no-dangling >/dev/null 2>&1 || rc=$?
            case $rc in 0 | 124) ;; *) why="fsck failed ($rc)" ;; esac   # 124: over 2 s, not a verdict
          fi
          if [ -n "$why" ]; then echo "::warning::workspace git store broken ($why): removing $g"; rm -rf "$g"; exit 0; fi
          find "$g" -name '*.lock' -mmin +5 -delete 2>/dev/null || true
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: ${{ runner.environment == 'self-hosted' }}
        with:
          fetch-depth: 0
      - name: Re-clone a broken workspace (self-hosted)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::checkout failed in this runner's workspace: removing its .git for a fresh clone"
          rm -rf "$GITHUB_WORKSPACE/.git"
      - uses: actions/checkout@v4
        if: steps.checkout.outcome == 'failure'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: gocache-test0-${{ github.sha }}
          restore-keys: gocache-test
      - name: Read the corpus pin
        id: pin
        run: echo "forge_ref=$(awk '/^FORGE_REF/ {print $3}' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Select the diff's tests
        # S4 (11-26): the selection runs once (3-8 s) and is handed to the corpus step's background compile and to
        # the test run below, so the two cannot select different packages.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/test-targets.sh list > "$RUNNER_TEMP/ci-fast.list"
      - name: Keep the corpus on the box and compile the diff's tests beside it (self-hosted)
        # S4 (11-26): the corpus/tables build was the fast job's last serial prefix (14-83 s on a tree this box has
        # not built, 2-5 s warm), and the affected-package run is the wall (measured 11-26 on 11 PR runs: 398 s of
        # a 512 s job). The compile reads only the checkout and the box's Go build cache — never .cards, which
        # ci-corpus.sh is about to link — so the two run together: the step costs max(corpus, compile) instead of
        # their sum, and the test run below reuses every compiled binary. Same selection, same skip rules, no
        # selected test runs here (-exec /bin/true; go keys a cached test result on the -exec command, so nothing is
        # faked); the .ds4 always-gate keeps its literal line and runs in both steps — it reads git ls-files only.
        if: runner.environment == 'self-hosted'
        env:
          CI_FAST_SKIP_KGEN: "1"
          CI_FAST_SKIP_ORACLE_REPLAY: "1"
        # ci-retry-cache.sh: a shared box's GOCACHE can lose an entry mid-build (11-28 run 46154534694 false-REDded
        # this step with 33 "could not import ... go-build/<hex>-d: no such file or directory" lines). It retries
        # exactly that class once; the same selection and skip rules run, and a real compile error still fails.
        run: bash scripts/ci-retry-cache.sh fast-precompile -- bash scripts/ci-fast.sh --precompile "${{ github.event.pull_request.base.sha }}" "$RUNNER_TEMP/ci-fast.list"
      - name: Restore the corpus
        id: corpus
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: .cards
          key: cards-${{ steps.pin.outputs.forge_ref }}-${{ hashFiles('engine/cards/**/*.go') }}
          restore-keys: cards-${{ steps.pin.outputs.forge_ref }}-
      - name: Fetch and compile the corpus
        if: runner.environment == 'github-hosted' && steps.corpus.outputs.cache-hit != 'true'
        run: make fetch-cards compile-cards
      - name: Refuse to run without the corpus
        run: |
          test -s .cards/cards.lock || { echo "no .cards corpus: every corpus test would skip"; exit 1; }
          grep -q "${{ steps.pin.outputs.forge_ref }}" .cards/cards.lock || { echo ".cards is not at FORGE_REF"; cat .cards/cards.lock; exit 1; }
      - name: Save the corpus
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.corpus.outputs.cache-hit != 'true' && matrix.shard == 0
        uses: actions/cache/save@v4
        with:
          path: .cards
          key: cards-${{ steps.pin.outputs.forge_ref }}-${{ hashFiles('engine/cards/**/*.go') }}
      - name: Build dirac's card tables
        run: |
          # On the box, ci-corpus.sh built this tree's tables once and .cards holds them; elsewhere build them here.
          if [ "${{ runner.environment }}" != self-hosted ]; then make dirac-tables; fi
      - name: Stable mtimes for the Go test cache
        run: bash scripts/ci-stable-mtimes.sh .
      - name: Affected packages and their test importers
        env:
          CI_FAST_SKIP_KGEN: "1"
          CI_FAST_SKIP_ORACLE_REPLAY: "1"
          CI_FAST_LIST: ${{ runner.temp }}/ci-fast.list
        run: bash scripts/ci-retry-cache.sh fast-tests -- bash scripts/ci-fast.sh ${{ github.event.pull_request.base.sha }}
      - name: Dirac walk and cache invariants (a walk/cache/State diff)
        # Class B of docs/agents/red-batches-20261128.md: a `perf(dirac)` change relaxed a read-only invariant the
        # heavy shards assert, so the queue was the first to see it and a whole batch re-ran — twice on the quiet
        # proof (runs 46156810528 and 46155595807, carrier #5994 in dirac/mana_window.go) and the type-cache line
        # (carrier #5986 in dirac/cast_quietseat.go/prep.go). The two assertions, TestQuietProofEDH
        # (cast_quietseat_test.go: "the walk changed the State") and TestTyCacheExcludesNonObjectSources
        # (static_typecache_test.go: "the table is not cached with Duplicant excluded"), must fail here on the pull
        # request, not in the merge batch. scripts/pr-dirac-invariant.sh runs them through `make test-one` (the
        # repo's capped target) and exits before any test when the diff touches none of the walk, cache, State,
        # payment/filter/keyword/kernel or edh-slice paths; it adds a check and weakens none.
        run: bash scripts/pr-dirac-invariant.sh "${{ github.event.pull_request.base.sha }}"

  lint:
    # A push to main whose tree a queue batch already passed (prior) skips lint: the batch ran it on this exact tree
    # (measured 11-20: 49 main pushes in 13 h, each ~160 s of go vet + fresh-clone-check on a box runner).
    needs: prior
    if: ${{ !cancelled() && needs.prior.outputs.passed != 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') && !startsWith(github.head_ref, 'hotfix/') && 'gorge-pr' || 'gorge-box') || 'ubuntu-24.04' }}
    steps:
      - name: Heal the runner's workspace (self-hosted)
        # 11-21: metal-gorge-box-4's workspace ref store broke ("fetching ref refs/remotes/origin/main failed: reference
        # already exists") and turned 13+ PRs' fast and lint red. Before checkout, as the runner user: a repository whose
        # refs do not list, or whose objects fail a quick connectivity check, is deleted, so checkout clones afresh.
        # Otherwise only stale lock files go: a healthy workspace keeps its refs, so checkout fetches incrementally (deleting
        # refs/remotes on every run made checkout re-fetch every ref: 27-31 s per job, 11-21). A checkout that still fails
        # removes .git and checks out again (the steps after it). No network check:
        # a fetch from the workspace hangs once checkout has removed its auth header, and timed out on every healthy
        # runner (20 s, then a full re-clone; 11-21).
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          ws=$GITHUB_WORKSPACE g=$GITHUB_WORKSPACE/.git
          [ -d "$g" ] || exit 0
          why=
          timeout 10 git -C "$ws" for-each-ref >/dev/null 2>&1 || why="for-each-ref failed"
          if [ -z "$why" ]; then
            rc=0; timeout 2 git -C "$ws" fsck --connectivity-only --no-dangling >/dev/null 2>&1 || rc=$?
            case $rc in 0 | 124) ;; *) why="fsck failed ($rc)" ;; esac   # 124: over 2 s, not a verdict
          fi
          if [ -n "$why" ]; then echo "::warning::workspace git store broken ($why): removing $g"; rm -rf "$g"; exit 0; fi
          find "$g" -name '*.lock' -mmin +5 -delete 2>/dev/null || true
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: ${{ runner.environment == 'self-hosted' }}
        with:
          # The ratchet guard compares the branch's own head tree with the merge base.
          fetch-depth: 0
      - name: Re-clone a broken workspace (self-hosted)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::checkout failed in this runner's workspace: removing its .git for a fresh clone"
          rm -rf "$GITHUB_WORKSPACE/.git"
      - uses: actions/checkout@v4
        if: steps.checkout.outcome == 'failure'
        with:
          # The ratchet guard compares the branch's own head tree with the merge base.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: gocache-lint-${{ github.sha }}
          restore-keys: gocache-lint-
      - name: Ratchets lower only post-merge
        if: github.event_name == 'pull_request'
        env:
          # The daily bot branch and merge-queue branches are exempt (codeshape.GuardExempt); a
          # fork's branch name is withheld so it cannot claim the exemption.
          HEAD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          # The PR's own tree. The checkout is the merge ref, which carries main's later operations.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run ./cmd/checkratchet "${{ github.event.pull_request.base.sha }}" "$HEAD_REF" "$HEAD_SHA"
      - name: Merge the current main
        # A pull request's checkout is the merge ref GitHub computed when the event fired; the job may start much later
        # (gorge-pr queue wait p90 ~22 min, max ~40, 11-20), and the PR then waits in the Mergify queue. 11-20 #2514
        # re-added map rows main already had: green alone, a duplicate key once merged, and a red batch. Merging the
        # main of now before vet (which compiles every package and its tests) catches that class here. A conflict is
        # left to Mergify, which reports it; the checks below then run on the merge ref as before.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
        run: |
          git fetch -q origin "${{ github.event.pull_request.base.ref }}"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then echo "the base has not moved since the merge ref"; exit 0; fi
          if git -c user.email=ci@invalid -c user.name=ci merge -q --no-edit FETCH_HEAD; then
            echo "merged the current base: $(git rev-parse --short FETCH_HEAD)"
          else
            git merge --abort; echo "::warning::conflicts with the current base; Mergify will report it"
          fi
      # The per-function growth rule (cmd/funcgrowth) is not a CI step: 11-26 operator, it ran in a merge batch and one PR's
      # growth reddened lint for eight. It runs locally in .githooks/pre-push (and `make lint`), against origin/main.
      # cmd/countgrowth (the count-metric growth rule) follows the same policy: it runs in `make lint`, not as a CI step.
      - name: FORGE_REF is in the Forge oracle driver
        # A FORGE_REF the driver (gorge-compliance develop's FORGE_ORACLE_REF) lacks fails forge-oracle-setup's pin
        # invariant on every xproof cycle (2026-11-25, 5bc5851a54). Only a diff that moves FORGE_REF calls the API.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-forge-ref-driver.sh "${{ github.event.pull_request.base.sha }}"
      - name: gofmt
        # S4c (11-27): a pull request formats only the Go files it changes. Formatting is a property of a file's own
        # bytes, so a file this diff does not touch cannot be made unformatted by it, and every other file in the
        # post-merge tree is one the base branch already passed this check on (or the main merged in above). The
        # whole tree is still checked on a batch, main and the nightly. Measured 11-26: whole-tree gofmt spent 2-6 s
        # of the PR lint job.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && [ -n "$HEAD_SHA" ]; then
            keep=
            for f in $(git diff --name-only "$BASE"..."$HEAD_SHA" -- '*.go'); do [ -f "$f" ] && keep="$keep $f"; done
          else
            keep=$(find . \( -name node_modules -o -name .worktrees \) -prune -o -type f -name '*.go' -print)
          fi
          if [ -z "$keep" ]; then echo "gofmt: no Go file in the diff"; exit 0; fi
          # shellcheck disable=SC2086
          out=$(gofmt -l $keep)
          if [ -n "$out" ]; then echo "gofmt: files need formatting:"; echo "$out"; exit 1; fi
      - name: go vet ./... (batches, main and the nightly)
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/')
        run: go vet ./...
      - name: go vet the diff's affected packages
        # A pull request vets the selection scripts/ci-fast.sh tests (test-targets.sh list: the changed packages and
        # every package whose tests import them; 3-8 s, and it needs no corpus — `list` execs the selector before the
        # preflight) instead of the whole tree. A vet finding needs a source change in the package it fires in, so
        # anything this diff can turn red is in that set, and the queue batch's lint — this same job on
        # mergify/merge-queue/* — still runs `go vet ./...` on the merged tree before anything lands. Measured 11-26:
        # vet ./... spent 58 s of a 94 s lint PR job recompiling the whole tree beside the concurrent fast job's
        # compile of the same packages. A diff that selects no package (docs, workflows) vets nothing here; the batch
        # covers the tree.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pkgs=$(awk -F'\t' '{print $2}' <<<"$(bash scripts/test-targets.sh list)" | sort -u)
          if [ -z "$pkgs" ]; then echo "vet: the diff selects no package; the batch's go vet ./... covers the tree"; exit 0; fi
          # shellcheck disable=SC2086
          bash scripts/ci-retry-cache.sh lint-vet -- go vet $pkgs
      - name: generated types are current
        run: go run ./cmd/gentypes -check
      - name: Lockstep constant mirrors (a dirac or engine diff)
        # TestLockstepConstants pins dirac's numeric mirrors of gorge's constants and its own annotation census.
        # A pull request's lint skipped dirac/oracle, so 11-28 #5778 (five-hybrid costs, a new //lockstep:const
        # annotation without the census bump) passed fast and turned four queue batches red on fresh-clone-check's
        # TestLockstepConstants alone. The test parses source and needs no corpus, so run it here on exactly the
        # diffs that can move a mirror: dirac/ (the annotations and the census) and engine/ (engine/rules,
        # engine/effects and engine/state hold the constants they mirror). This only adds a failing step; the
        # queue's fresh-clone-check still runs the test on the merged tree.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"..."$HEAD_SHA" -- dirac/ engine/)
          if [ -z "$changed" ]; then echo "lockstep constants: the diff touches neither dirac/ nor engine/"; exit 0; fi
          go test -timeout 3m -run '^TestLockstepConstants$' ./dirac/oracle
      - name: A fresh clone builds, and dirac's tests skip without a corpus
        # ~60 s per run. A pull request's own lint skips it (the Mergify batch runs it on the merged tree before
        # anything lands); batches, main and the nightly keep it.
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/')
        run: make fresh-clone-check
      - name: Save the Go cache
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: gocache-lint-${{ github.sha }}

  test:
    needs: [prior, prepare]
    if: ${{ !cancelled() && needs.prior.outputs.passed != 'true' && needs.prepare.result == 'success' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'gorge-box' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Heal the runner's workspace (self-hosted)
        # 11-21: metal-gorge-box-4's workspace ref store broke ("fetching ref refs/remotes/origin/main failed: reference
        # already exists") and turned 13+ PRs' fast and lint red. Before checkout, as the runner user: a repository whose
        # refs do not list, or whose objects fail a quick connectivity check, is deleted, so checkout clones afresh.
