# Build the public documentation site (mkdocs.yml, docs/site/) and publish it
# to GitHub Pages. A push to develop or a PR that touches the paths below runs
# the same strict build as a check; only main (push, cron, manual run) deploys.
#
# The set-support tables are rendered here, not measured: the compliance
# oracle (oraclediff) lives in gorge-compliance, whose nightly CI publishes its
# per-set status to an orphan docs-data branch, and dirac's per-set
# figures are read from the committed dirac/docs/support.md.
name: docs

on:
  push:
    branches: [main, develop]
    paths:
      - docs/site/**
      - mkdocs.yml
      - scripts/docs_sets.py
      - scripts/docs_sets_test.py
      - scripts/docs_web_test.py
      - scripts/docs_perf_figs.py
      - scripts/docs_perf_figs_test.py
      - scripts/docs_magezero_figs.py
      - web/src/lib/layoutprofile.ts
      - web/src/components/PlaySettingsPanel.svelte
      - dirac/docs/support.md
      - cmd/pkgmap/**
      - scripts/docs_compliance_stub.py
      - .github/workflows/docs.yml
  # A PR (develop -> main above all) builds the site strictly but never
  # deploys it, so a broken link fails before it reaches the public site.
  pull_request:
    paths:
      - docs/site/**
      - mkdocs.yml
      - scripts/docs_sets.py
      - scripts/docs_sets_test.py
      - scripts/docs_web_test.py
      - scripts/docs_perf_figs.py
      - scripts/docs_perf_figs_test.py
      - scripts/docs_magezero_figs.py
      - web/src/lib/layoutprofile.ts
      - web/src/components/PlaySettingsPanel.svelte
      - dirac/docs/support.md
      - cmd/pkgmap/**
      - scripts/docs_compliance_stub.py
      - .github/workflows/docs.yml
  # A daily rebuild picks up gorge-compliance's docs-data, written by its
  # nightly job (cron 09:41 UTC, which GitHub often starts hours late), so
  # this runs well after it.
  schedule:
    - cron: '17 17 * * *'
  # gorge-compliance dispatches this when its docs/engines/ changes, so the
  # "For engine authors" pages are rebuilt without a gorge push.
  repository_dispatch:
    types: [docs-compliance]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/site/requirements.txt

      # The "For engine authors" pages (compliance/engines/*) are owned by
      # gorge-compliance: take its main's docs/engines/ (sparse, docs/ only)
      # into the site tree. Without them the build still passes: the
      # scripts/docs_compliance_stub.py hook stubs each missing page.
      - name: Check out the compliance engine docs
        uses: actions/checkout@v4
        with:
          repository: adams-shaun/gorge-compliance
          ref: main
          path: .compliance-docs
          sparse-checkout: docs/engines
          sparse-checkout-cone-mode: true

      - name: Copy the compliance engine docs into the site
        run: |
          mkdir -p docs/site/compliance/engines
          cp .compliance-docs/docs/engines/* docs/site/compliance/engines/
          rm -rf .compliance-docs

      # Corpus-free and ~1 s: the per-tier package tables and the tier graph
      # (cmd/pkgmap, classification in docs/site/architecture/packages.tiers.json).
      - name: Generate the package map
        run: go run ./cmd/pkgmap > docs/site/architecture/_generated_packages.md

      # The per-set card-support tables (support/_generated_sets.md, included
      # by sets.md): gorge-compliance's nightly compliance job publishes its
      # per-set status (Level A for every set, Level B for the printed sets)
      # to its orphan docs-data branch; dirac's per-set acceptance is
      # read from dirac/docs/support.md. Without docs-data the tables still render,
      # with the gorge columns marked as not available.
      # The Web client pages (web/layouts.md, web/gameplay.md) name the
      # client's layout presets and play settings; fail if the source moved.
      - name: Check the web client pages against the client source
        run: python3 scripts/docs_web_test.py

      # The performance figures are drawn from docs/site/performance/data/perf.json.
      - name: Check the performance figures against their data
        run: python3 -m unittest discover -s scripts -p 'docs_perf_figs_test.py'

      - name: Render the per-set support tables
        run: |
          python3 -m unittest discover -s scripts -p 'docs_sets_test.py'
          args=(--dirac-support dirac/docs/support.md)
          if git fetch --depth=1 https://github.com/adams-shaun/gorge-compliance.git docs-data 2>/dev/null; then
            d=$(mktemp -d)
            for f in status-A.jsonl status-B.jsonl meta.json; do git show "FETCH_HEAD:$f" > "$d/$f"; done
            args+=("$d/status-A.jsonl" --level-b "$d/status-B.jsonl" --meta "$d/meta.json")
          else
            echo "no gorge-compliance docs-data branch; the gorge columns render as not available"
          fi
          python3 scripts/docs_sets.py "${args[@]}"

      - name: Build the site
        run: mkdocs build --strict

      # --strict never parses Mermaid (Material renders it in the browser), so
      # a diagram syntax error would ship as an error box: parse every diagram
      # with the Mermaid the site loads, in the runner's Chrome.
      - name: Parse every Mermaid diagram
        run: python3 scripts/docs_mermaid_check.py site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  # Only main publishes; develop pushes and PRs stop at the strict build.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
