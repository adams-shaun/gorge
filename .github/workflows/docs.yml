# Build the public documentation site (mkdocs.yml, docs/site/) and publish it
# to GitHub Pages. Every push to develop and every PR runs the same strict
# build as a check; only main (push, cron, manual run) deploys.
#
# The set-support table is no longer measured here: the compliance oracle
# that measures it (oraclediff) lives in gorge-compliance
# (github.com/adams-shaun/gorge-compliance), so the set page shows its hand
# snapshot (docs/decisions/0001-repo-layout.md, amendment 3).
#
# The engine-speed chart reads history.jsonl from the orphan `perf-data`
# branch when that branch exists; perf data never lands on main.
name: docs

on:
  push:
    branches: [main, develop]
    paths:
      - docs/site/**
      - mkdocs.yml
      - scripts/docs_sets.py
      - cmd/pkgmap/**
      - .github/workflows/docs.yml
  # A PR (develop -> main above all) builds the site strictly but never
  # deploys it, so a broken link fails before it reaches the public site.
  pull_request:
    paths:
      - docs/site/**
      - mkdocs.yml
      - scripts/docs_sets.py
      - cmd/pkgmap/**
      - .github/workflows/docs.yml
  # The perf-data branch changes many times a day; a daily rebuild picks it up.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/site/requirements.txt

      # Corpus-free and ~1 s: the per-tier package tables and the tier graph
      # (cmd/pkgmap, classification in docs/site/architecture/packages.tiers.json).
      - name: Generate the package map
        run: go run ./cmd/pkgmap > docs/site/architecture/_generated_packages.md

      - name: Fetch the perf history
        run: |
          if git fetch --depth=1 origin perf-data 2>/dev/null; then
            mkdir -p docs/site/perf
            git show FETCH_HEAD:history.jsonl > docs/site/perf/history.jsonl 2>/dev/null \
              || rm -f docs/site/perf/history.jsonl
          else
            echo "no perf-data branch yet; the tracking page shows 'no data yet'"
          fi

      # gorge-compliance's nightly compliance job publishes its per-set status
      # (Level A for every set, Level B for the printed sets) to its orphan
      # docs-data branch. Without it the set page shows its hand snapshot.
      - name: Fetch the per-set compliance status
        run: |
          if git fetch --depth=1 https://github.com/adams-shaun/gorge-compliance.git docs-data 2>/dev/null; then
            d=$(mktemp -d)
            for f in status-A.jsonl status-B.jsonl meta.json; do git show "FETCH_HEAD:$f" > "$d/$f"; done
            commit=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$d/meta.json")
            date=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["date"])' "$d/meta.json")
            python3 scripts/docs_sets.py "$d/status-A.jsonl" --level-b "$d/status-B.jsonl" --commit "$commit" --date "$date"
          else
            echo "no gorge-compliance docs-data branch yet; the set page shows its hand snapshot"
          fi

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  # Only main publishes; develop pushes and PRs stop at the strict build.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
