# Merge main into every open PR that conflicts with it only in generated files, and push the merge (scripts/pr-autoresolve.sh).
#
# main regenerates dirac/docs/support.md, kgen's acceptance pins, the kop ordinals and the ratchet files many times a day,
# and almost every open dirac PR then sat CONFLICTING on them alone until a human or an agent merged main and rebuilt
# them by hand (11-25). The generated set is scripts/autoresolve-paths.tsv; a conflict in any other path is left alone.
#
# Token: the push must be made with the REGEN_TOKEN secret (a user token, contents:write on this repo). A push made with
# the workflow's GITHUB_TOKEN is attributed to github-actions[bot], and its ci/docs runs on the PR stop at
# action_required (a run needing a maintainer's approval), so the PR gets no fast/lint checks and Mergify never queues it.
# 11-25: the resolve step fell back to GITHUB_TOKEN (`secrets.REGEN_TOKEN || github.token`) and every autoresolve push
# since 12:00Z left ~600 runs at action_required. There is no fallback now: the list job checks REGEN_TOKEN is a user
# token (GET /user) before any PR is touched and fails red, naming the cause, when it is not.
#
# Mergify cannot do this: its update action (queue_rules update_method merge|rebase, update_bot_account) only updates a
# branch that merges cleanly, and it never rebuilds generated files.
name: pr-autoresolve

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr-autoresolve-list
  cancel-in-progress: false

jobs:
  list:
    if: github.repository == 'adams-shaun/gorge'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      # The list step runs scripts/pr-autoresolve-list.py: check out scripts/ only (11-25: every run failed "can't open
      # file" because this job had no checkout).
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
          persist-credentials: false
      # Fail here, once and loudly, rather than push with a token whose pushes start no CI (see the header).
      - name: Require a user token for the pushes
        env:
          REGEN_TOKEN: ${{ secrets.REGEN_TOKEN }}
        run: |
          if [ -z "$REGEN_TOKEN" ]; then
            echo "::error::secrets.REGEN_TOKEN is empty in this run (event ${{ github.event_name }}, actor ${{ github.actor }}). A GITHUB_TOKEN push leaves the PR's ci/docs runs at action_required; nothing is pushed. Set REGEN_TOKEN to a user token with contents:write."
            exit 1
          fi
          echo "::add-mask::$REGEN_TOKEN"
          login=$(curl -fsS -H "Authorization: Bearer $REGEN_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/user | python3 -c 'import json, sys; print(json.load(sys.stdin)["login"])') || {
            echo "::error::REGEN_TOKEN is not a working user token (GET /user refused it: expired, revoked, or an app token). Nothing is pushed."
            exit 1
          }
          case $login in *'[bot]') echo "::error::REGEN_TOKEN belongs to $login, a bot: its pushes need approval to run CI. Nothing is pushed."; exit 1 ;; esac
          echo "pushes go as $login"
      - name: Open non-draft PRs to main that conflict
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # GitHub computes mergeable lazily after main moves: UNKNOWN until then. Asking starts the computation, so
        # retry until no PR is UNKNOWN (at most 5 min). regen/* branches rebuild themselves (scripts/regen-main.sh).
        run: |
          for i in $(seq 1 15); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls?state=open&base=main&per_page=100" >pulls.json
            # The list endpoint carries no mergeable; ask each PR (this also starts GitHub's lazy computation).
            python3 scripts/pr-autoresolve-list.py >prs.txt
            read -r unknown prs <prs.txt
            [ "$unknown" -eq 0 ] && break
            echo "$unknown PRs not computed yet; retry $i"; sleep 20
          done
          echo "conflicting: $prs"
          echo "prs=$prs" >>"$GITHUB_OUTPUT"

  resolve:
    needs: list
    if: needs.list.outputs.prs != '[]' && needs.list.outputs.prs != ''
    # The box runners keep the corpus (scripts/ci-corpus.sh), which the regeneration needs.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && 'gorge-box' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # 11-25: 2 at a time took ~45 min to clear the ~40 PRs one merge batch re-conflicts, about one batch interval;
      # 4 fits the box runners left free beside a running merge batch.
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.list.outputs.prs) }}
    concurrency:
      group: pr-autoresolve-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # No GITHUB_TOKEN header in the git config: it would override the REGEN_TOKEN credential below.
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Merge main and rebuild the generated files
        env:
          # REGEN_TOKEN only, never github.token: the list job checked it is a user token.
          GH_TOKEN: ${{ secrets.REGEN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ matrix.pr }}
        # Exit 4: a conflict outside the generated set, which this workflow leaves alone (a notice, not a red job).
        # The token rides in this process's git config (GIT_CONFIG_*), never ~/.gitconfig: the box runners share one
        # HOME, whose ~/.gitconfig had collected one insteadOf per earlier job, most with an expired job token, and git
        # picked among them (11-25: "Invalid username or token" on half the pushes). An empty per-job global config
        # shuts those out. The value is masked in logs and never echoed.
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secrets.REGEN_TOKEN is empty; not pushing with GITHUB_TOKEN"; exit 1; }
          echo "::add-mask::$GH_TOKEN"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/autoresolve.gitconfig"; : >"$GIT_CONFIG_GLOBAL"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/"
          rc=0; bash scripts/pr-autoresolve.sh "$PR" || rc=$?
          [ "$rc" -ne 4 ] || { echo "::notice::#$PR conflicts outside the generated set; left alone"; exit 0; }
          exit "$rc"
